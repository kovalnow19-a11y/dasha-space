/* ---------- статус в шапке ---------- */
const SYNC_UI = {ok:['☁️','Сохранено','Всё сохранено в облаке'], sync:['⏳','Сохраняю…','Идёт сохранение в облако'], wait:['⏳','Сохраняю…','Есть изменения, сейчас отправлю в облако'],
  off:['📴','Нет связи','Нет связи с облаком. Изменения сохранены в этом браузере и отправятся, когда появится интернет'],
  err:['⚠️','Не сохранено','Не получилось сохранить в облако. Нажми на значок, чтобы повторить']};
function setStatus(st){
  CL.status = st; const el = $id('syncBadge'), u = SYNC_UI[st] || SYNC_UI.ok;
  el.hidden = !CL.ready;
  el.className = 'sync '+(st==='ok' ? 'ok' : st==='off' || st==='err' ? 'err' : '');
  el.innerHTML = `<span>${u[0]}</span><span class="st">${u[1]}</span>`;
  el.title = u[2];
}
function syncText(){ return (SYNC_UI[CL.status] || SYNC_UI.ok)[2]; }

/* ---------- отправка изменений ---------- */
function schedulePush(ms){
  if(!CL.uid || !CL.ready) return;
  clearTimeout(CL.pushT);
  if(CL.status!=='off' && CL.status!=='err') setStatus('wait');
  CL.pushT = setTimeout(cloudPush, ms==null ? 1200 : ms);
}
function pendingCount(){
  if(!CL.uid) return 0;
  ensureIds(S);
  const items = cloudItems(S); let n = Object.keys(CL.pmedia).length;
  for(const key in items) if(!skipKey(key) && CL.base[key]!==hashOf(items[key].data)) n++;
  for(const key in CL.base) if(!items[key] && !skipKey(key) && isKnownKey(key) && CL.base[key]!==DEL) n++;
  return n;
}
async function cloudPush(){
  if(!CL.uid || !CL.ready) return false;
  if(CL.busy || CL.pulling){ CL.again = true; return false; }
  CL.busy = true; clearTimeout(CL.pushT);
  let ok = true;
  try {
    setStatus('sync');
    const failed = await uploadPendingMedia();
    ensureIds(S);
    const items = cloudItems(S), rows = [], hs = [];
    for(const key in items){ if(skipKey(key)) continue; const it = items[key], h = hashOf(it.data);
      if(CL.base[key]!==h){ rows.push({user_id:CL.uid, kind:it.kind, item_id:it.id, data:JSON.parse(JSON.stringify(it.data)), deleted:false}); hs.push([key,h]); } }
    for(const key in CL.base){ if(!items[key] && !skipKey(key) && isKnownKey(key) && CL.base[key]!==DEL){ const i = key.indexOf('|');
      rows.push({user_id:CL.uid, kind:key.slice(0,i), item_id:key.slice(i+1), data:{}, deleted:true}); hs.push([key,DEL]); } }
    for(const table of [SB_TABLE, SB_TRAVEL]){
      const idx = hs.map((x,i) => i).filter(i => tableOfKey(hs[i][0])===table);
      for(let i=0;i<idx.length;i+=200){
        const part = idx.slice(i,i+200);
        const {error} = await CL.sb.from(table).upsert(part.map(j => rows[j]), {onConflict:'user_id,kind,item_id'});
        if(error){ if(table===SB_TRAVEL && !isNetErr(error)){ console.warn('travel table', error); CL.travelOff = true; requestRender(); break; } throw error; }
        part.forEach(j => { CL.base[hs[j][0]] = hs[j][1]; });
        CL.pushSeq++; saveBase();
      }
    }
    if(failed){ ok = false; setStatus('err'); } else setStatus('ok');
  } catch(err) { ok = false; console.warn('cloud push', err); setStatus(isNetErr(err) ? 'off' : 'err'); }
  finally {
    CL.busy = false;
    if(CL.again){ CL.again = false; schedulePush(300); }
    else if(!ok){ clearTimeout(CL.pushT); CL.pushT = setTimeout(cloudPush, 20000); }
  }
  return ok;
}
/* отправляет всё, что накопилось; true — если в облаке всё сохранено */
async function flushAll(){
  for(let i=0;i<10;i++){
    if(CL.busy || CL.pulling){ await sleep(400); continue; }
    await cloudPush();
    if(!pendingCount()) return true;
    if(CL.status==='off' || CL.status==='err') return false;
  }
  return !pendingCount();
}

/* ---------- получение изменений ---------- */
async function cloudPull(fresh){
  if(!CL.uid || CL.pulling || CL.busy) return false;
  CL.pulling = true;
  try {
    const seq = CL.pushSeq, back = t => !fresh && t ? new Date(new Date(t).getTime()-15000).toISOString() : null;
    const rows = await fetchRows(SB_TABLE, back(CL.since));
    let trows = [], travelOff = false;
    try { trows = await fetchRows(SB_TRAVEL, CL.travelOff ? null : back(CL.sinceT)); }
    catch(err) { if(isNetErr(err)) throw err; console.warn('travel table', err); travelOff = true; } // ошибка таблицы поездок не мешает остальным разделам
    /* пока открыто окно, идёт ввод или отправка — не подменяем данные, заберём их в следующий раз */
    if(CL.busy || seq!==CL.pushSeq || CL.hold || (CL.ready && (isModalOpen() || isTyping()))) return false;
    if(fresh){ CL.base = {}; CL.since = null; CL.sinceT = null; }
    const wasOff = CL.travelOff; CL.travelOff = travelOff;
    ensureIds(S);
    const local = fresh ? {} : cloudItems(S);
    let changed = fresh || wasOff!==travelOff;
    const apply = r => {
      const key = r.kind+'|'+r.item_id; if(!isKnownKey(key)) return;
      const rh = r.deleted ? DEL : hashOf(r.data);
      const lh = local[key] ? hashOf(local[key].data) : DEL, bh = CL.base[key]==null ? DEL : CL.base[key];
      if(lh===bh && lh!==rh){ if(r.deleted) delete local[key]; else local[key] = {kind:r.kind, id:r.item_id, data:r.data}; changed = true; }
      CL.base[key] = rh;
    };
    const maxTs = (list, cur) => list.reduce((m,r) => !m || r.updated_at>m ? r.updated_at : m, cur);
    rows.forEach(apply); trows.forEach(apply);
    CL.since = maxTs(rows, CL.since); if(!travelOff) CL.sinceT = maxTs(trows, CL.sinceT);
    saveBase();
    if(changed){
      S = cloudState(local); prepLight();
      if(CL.ready){ saveLocalCopy(); requestRender(); }
    }
    if(CL.status==='off' || (CL.status==='err' && !pendingCount())) setStatus('ok');
    return true;
  } catch(err) { console.warn('cloud pull', err); if(CL.ready) setStatus(isNetErr(err) ? 'off' : 'err'); return false; }
  finally { CL.pulling = false; }
}
async function fetchRows(table, since){
  const rows = [];
  for(let from=0;;from+=1000){
    let q = CL.sb.from(table).select('kind,item_id,data,deleted,updated_at')
      .order('updated_at',{ascending:true}).order('kind').order('item_id').range(from, from+999);
    q = since ? q.gt('updated_at', since) : q.eq('deleted', false);
    const {data, error} = await q; if(error) throw error;
    rows.push(...data); if(data.length<1000) break;
  }
  return rows;
}
function requestRender(){ if(isModalOpen() || isTyping()){ CL.needRender = true; return; } CL.needRender = false; render(); }

async function cloudSync(){
  if(!CL.uid || !CL.ready) return;
  await cloudPush();
  if(CL.status==='off') return;
  await cloudPull(false);
  await resolveUrls();
}

/* ---------- изображения в облаке ---------- */
function dataUrlToBlob(u){
  const m = /^data:([^;,]+)?(;base64)?,([\s\S]*)$/.exec(u||''); if(!m) throw new Error('bad image');
  const type = m[1] || 'application/octet-stream';
  if(!m[2]) return new Blob([decodeURIComponent(m[3])], {type});
  const bin = atob(m[3]), a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type});
}
function blobToDataUrl(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function uploadPendingMedia(){
  let failed = 0;
  for(const id of Object.keys(CL.pmedia)){
    const src = CL.pmedia[id]; if(!src){ delete CL.pmedia[id]; continue; }
    try {
      let blob = dataUrlToBlob(src);
      if(!/^image\/(webp|jpeg|png)$/.test(blob.type)) blob = dataUrlToBlob(await compressImage(blob, 1400, 0.8));
      const {error} = await CL.sb.storage.from(SB_BUCKET).upload(mediaPath(id), blob, {contentType:blob.type, upsert:true, cacheControl:'31536000'});
      if(error) throw error;
      if(CL.pmedia[id]===src) delete CL.pmedia[id];
      savePendingMedia();
    } catch(err) { failed++; if(isNetErr(err)) throw err; console.warn('media upload', id, err); }
  }
  return failed;
}
async function resolveUrls(){
  if(!CL.uid || !CL.sb) return;
  const now = Date.now(), need = []; let ch = false;
  usedMediaIds().forEach(id => {
    const c = CL.urls[id];
    if(CL.pmedia[id]){ if(MEDIA[id]!==CL.pmedia[id]){ MEDIA[id] = CL.pmedia[id]; ch = true; } return; }
    if(MEDIA[id] && MEDIA[id].startsWith('data:')) return;
    if(c && c.exp>now+3600e3){ if(MEDIA[id]!==c.u){ MEDIA[id] = c.u; ch = true; } return; }
    if(CL.miss[id] && CL.miss[id]>now) return;
    need.push(id);
  });
  try {
    for(let i=0;i<need.length;i+=100){
      const chunk = need.slice(i,i+100);
      const {data, error} = await CL.sb.storage.from(SB_BUCKET).createSignedUrls(chunk.map(mediaPath), 604800);
      if(error) throw error;
      (data||[]).forEach((r,j) => { const id = r.path ? r.path.split('/').pop() : chunk[j];
        if(r.signedUrl && !r.error){ CL.urls[id] = {u:r.signedUrl, exp:now+604800e3}; MEDIA[id] = r.signedUrl; ch = true; }
        else CL.miss[id] = now+60e3; });
    }
  } catch(err) { console.warn('media urls', err); }
  if(ch){ saveUrls(); requestRender(); }
}
/* картинки для резервной копии: из памяти или скачиваются из облака */
async function collectMedia(st){
  const media = {}; let missing = 0;
  for(const id of usedMediaIds(st)){
    const src = CL.pmedia[id] || (MEDIA[id] && MEDIA[id].startsWith('data:') ? MEDIA[id] : null);
    if(src){ media[id] = src; continue; }
    try { const {data, error} = await CL.sb.storage.from(SB_BUCKET).download(mediaPath(id)); if(error) throw error; media[id] = await blobToDataUrl(data); }
    catch(err) { missing++; }
  }
  return {media, missing};
}
/* картинки из файла копии или из старого хранилища браузера → очередь загрузки в облако */
function adoptMedia(st, media){
  const ok = id => typeof media[id]==='string' && /^data:image\//.test(media[id]);
  (st.posts||[]).forEach(p => { if(p.cover && !ok(p.cover)) p.cover = null; p.shots = (p.shots||[]).filter(ok); });
  usedMediaIds(st).forEach(id => { MEDIA[id] = media[id]; CL.pmedia[id] = media[id]; delete CL.urls[id]; });
  savePendingMedia();
}
async function removeAllCloudMedia(bucket){
  bucket = bucket || SB_BUCKET;
  try {
    for(let i=0;i<50;i++){
      const {data, error} = await CL.sb.storage.from(bucket).list(CL.uid, {limit:100});
      if(error || !data || !data.length) break;
      const paths = data.filter(f => f.name && !CL.pmedia[f.name]).map(f => CL.uid+'/'+f.name);
      if(!paths.length) break;
      const r = await CL.sb.storage.from(bucket).remove(paths); if(r.error) break;
    }
  } catch(err) {}
}
function downloadJson(obj, name){
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- перенос из старого хранилища браузера ---------- */
function hasLegacy(){ try { return !!localStorage.getItem(KEY); } catch(err) { return false; } }
function legacyInfo(){
  try {
    const raw = localStorage.getItem(KEY); if(!raw) return null;
    const st = normalize(cleanDemo(JSON.parse(raw)));
    let media = {}; try { media = JSON.parse(localStorage.getItem(MKEY) || '{}') || {}; } catch(err) {}
    const n = countRecords(st); if(!n) return null;
    return {S:st, media, n, imgs:[...usedMediaIds(st)].filter(id => typeof media[id]==='string').length};
  } catch(err) { return null; }
}
function markMigrated(){ try { localStorage.setItem(cloudKey('migrated'), String(Date.now())); } catch(err) {} }
function startSeeding(){ if(!CL.seedHeld) return; CL.seedHeld = false; prepHabits(); prepBlog(); save(); }
/* объединение: записи с одинаковым id не задваиваются, при совпадении остаётся версия из облака */
function mergeStates(cur, old){
  const a = cloudItems(cur), b = cloudItems(old), low = t => String(t||'').trim().toLowerCase();
  const byName = new Map(cur.habits.map(h => [low(h.name), String(h.id)])), remap = {};
  old.habits.forEach(h => { const id = byName.get(low(h.name)); if(id && id!==String(h.id)) remap[h.id] = id; });
  const SEED = ['always behind','copying success','the $35 apartment','100 countries before 30'];
  Object.values(b).forEach(it => {
    const key = it.kind+'|'+it.id;
    if(it.kind==='settings') return;
    if(it.kind==='habits' && remap[it.id]) return;
    if((it.kind==='ideas' || it.kind==='posts') && SEED.includes(low(it.data.title)) && cur[it.kind].some(x => low(x.title)===low(it.data.title))) return;
    if(it.kind==='habit_log'){ const ex = a[key], ids = (it.data.v||[]).map(id => remap[id] || id);
      a[key] = {kind:it.kind, id:it.id, data:{v:[...new Set([...(ex ? ex.data.v : []), ...ids])]}}; return; }
    if(it.kind==='order'){ const ex = a[key], ids = (ex ? ex.data.ids : []).slice();
      it.data.ids.forEach(id => { if(!ids.includes(id)) ids.push(id); }); a[key] = {kind:'order', id:it.id, data:{ids}}; return; }
    if(!a[key] || (it.kind==='days' && emptyDay(a[key].data.v))) a[key] = it;
  });
  return cloudState(a);
}
let MIG = null;
function openMigrate(L){
  const cloudN = countRecords(S), mode = cloudN ? 'merge' : 'move';
  MIG = {L, mode};
  openModal(`<h3>📦 Перенос в облако</h3>
    <p>В этом браузере есть записи кабинета, сохранённые до подключения облака: <b>${L.n}</b> ${plural(L.n,'запись','записи','записей')}${L.imgs ? ` и <b>${L.imgs}</b> ${plural(L.imgs,'изображение','изображения','изображений')}` : ''}.</p>
    ${mode==='move' ? '<p>Облако пока пустое — перенесу всё туда, и записи появятся на всех твоих устройствах.</p>'
      : `<p>В облаке уже есть записи (${cloudN}). Можно добавить к ним записи из этого браузера: одинаковые записи не задвоятся, а при совпадении останется версия из облака.</p>
         <p class="muted sm">Если это те же данные, которые ты уже перенесла с другого устройства, выбери «Оставить облако».</p>`}
    <div class="note">Сначала скачается файл с резервной копией этих записей. Из браузера ничего не удаляется.</div>
    <div class="mfoot">
      ${mode==='merge' ? '<button class="btn ghost" data-a="migCloud">Оставить облако</button>' : ''}
      <button class="btn ghost" data-a="migSkip">Не сейчас</button>
      <button class="btn" data-a="migGo">${mode==='move' ? 'Скачать копию и перенести' : 'Скачать копию и добавить'}</button>
    </div>`);
}
async function runMigration(L, mode){
  downloadJson(Object.assign({}, L.S, {media:L.media}), `kabinet-iz-brauzera-${T()}.json`);
  const old = JSON.parse(JSON.stringify(L.S)); ensureIds(old);
  adoptMedia(old, L.media);
  S = mode==='move' ? old : mergeStates(S, old);
  CL.seedHeld = false; prepHabits(); prepBlog();
  saveLocalCopy(); render();
  openModal('<h3>Переношу…</h3><p>Отправляю записи и изображения в облако. Не закрывай страницу.</p>');
  const done = await flushAll();
  markMigrated(); render();
  openModal(done
    ? `<h3>✨ Готово</h3><p>Все записи${L.imgs ? ' и изображения' : ''} перенесены в облако и теперь доступны на всех устройствах после входа.</p>
       <p class="muted sm">Резервная копия скачана файлом. Старая копия всё ещё лежит в памяти этого браузера — её можно удалить, чтобы освободить место, или оставить.</p>
       <div class="mfoot"><button class="btn ghost" data-a="migFree">Удалить старую копию из браузера</button><button class="btn" data-a="mclose">Готово</button></div>`
    : `<h3>Почти готово</h3><p>Записи сохранены в этом браузере, но часть ещё не отправилась в облако (нет связи). Кабинет отправит их сам, когда появится интернет — значок в шапке станет «☁️ Сохранено».</p>
       <p class="muted sm">Резервная копия скачана файлом, старые данные в браузере не тронуты.</p>
       <div class="mfoot"><button class="btn" data-a="mclose">Понятно</button></div>`);
}

/* ---------- вход ---------- */
function authShow(title, sub, body){ $id('auth').hidden = false; $id('authTitle').textContent = title; $id('authSub').textContent = sub; $id('authBody').innerHTML = body; }
function authHide(){ $id('auth').hidden = true; $id('authBody').innerHTML = ''; }
function authErrText(e){
  const m = String((e && e.message) || e || '');
  if(/invalid login credentials/i.test(m)) return 'Неверный email или пароль';
  if(/email not confirmed/i.test(m)) return 'Email не подтверждён. Подтверди пользователя в Supabase: Authentication → Users.';
  if(/rate limit|too many/i.test(m)) return 'Слишком много попыток. Подожди немного и попробуй снова.';
  if(/password/i.test(m) && /least|short|weak/i.test(m)) return 'Пароль слишком простой или короткий';
  if(isNetErr(e)) return 'Нет связи с интернетом';
  return 'Не получилось: '+m;
}
function authMsg(msg, ok){ return msg ? `<div class="auth-err ${ok?'ok':''}">${esc(msg)}</div>` : ''; }
function authLogin(msg, ok){
  let last = ''; try { last = localStorage.getItem('da_cloud_last_email') || ''; } catch(err) {}
  authShow('Привет!', 'Войди, чтобы открыть кабинет', `${authMsg(msg, ok)}
    <form id="authForm" class="stack" style="margin-top:0" novalidate>
      <label class="f"><span>Email</span><input name="email" type="email" autocomplete="username" inputmode="email" required value="${esc(last)}"></label>
      <label class="f"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Войти</button>
    </form>
    <button class="auth-link" type="button" id="authForgot">Забыла пароль?</button>`);
  const f = $id('authForm');
  f.onsubmit = async e => {
    e.preventDefault();
    const email = f.email.value.trim(), password = f.password.value;
    if(!email || !password){ authLogin('Впиши email и пароль'); return; }
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Вхожу…';
    try {
      const {data, error} = await CL.sb.auth.signInWithPassword({email, password});
      if(error) throw error;
      startCloud(data.user);
    } catch(err) { authLogin(authErrText(err)); }
  };
  $id('authForgot').onclick = async () => {
    const email = f.email.value.trim();
    if(!email){ authLogin('Впиши email — пришлю на него ссылку для нового пароля'); return; }
    try {
      const {error} = await CL.sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
      if(error) throw error;
      authLogin('Если такой аккаунт есть, письмо со ссылкой уже в пути. Проверь почту и папку «Спам».', true);
    } catch(err) { authLogin(authErrText(err)); }
  };
  if(!('ontouchstart' in window)) (last ? f.password : f.email).focus();
}
function authNewPassword(msg){
  authShow('Новый пароль', 'Придумай новый пароль для входа', `${authMsg(msg)}
    <form id="authForm" class="stack" style="margin-top:0">
      <label class="f"><span>Новый пароль (минимум 8 символов)</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn" type="submit">Сохранить пароль</button>
    </form>`);
  const f = $id('authForm');
  f.onsubmit = async e => {
    e.preventDefault();
    const password = f.password.value;
    if(password.length<8){ authNewPassword('Нужно минимум 8 символов'); return; }
    const btn = f.querySelector('button'); btn.disabled = true;
    try {
      const {data, error} = await CL.sb.auth.updateUser({password});
      if(error) throw error;
      if(CL.ready) authHide(); else startCloud(data.user);
      toast('Пароль обновлён');
    } catch(err) { authNewPassword(authErrText(err)); }
  };
}
async function cloudLogout(){
  CL.leaving = true;
  try { await CL.sb.auth.signOut(); } catch(err) {}
  clearUserCache();
  location.replace(location.pathname);
}

/* ---------- запуск ---------- */
async function startCloud(user){
  if(CL.uid){ authHide(); return; }
  CL.uid = user.id; CL.email = user.email || '';
  try { localStorage.setItem('da_cloud_last_email', CL.email); } catch(err) {}
  const cached = lsGet('state', null), b = lsGet('base', null);
  CL.urls = lsGet('urls', {}) || {}; CL.pmedia = lsGet('pmedia', {}) || {};
  const now = Date.now();
  Object.entries(CL.urls).forEach(([id,c]) => { if(c && c.exp>now) MEDIA[id] = c.u; });
  Object.keys(CL.pmedia).forEach(id => { MEDIA[id] = CL.pmedia[id]; });
  if(cached && b){
    /* на этом устройстве уже есть копия: открываем сразу, свежие данные подтянутся следом */
    CL.base = b.base || {}; CL.since = b.since || null; CL.sinceT = b.sinceT || null; S = normalize(cached);
    beginApp(); cloudSync(); return;
  }
  authShow('Минутку…', 'Загружаю данные из облака', '<p class="muted" style="margin:0">Это нужно только при первом входе на этом устройстве.</p>');
  if(!await cloudPull(true)){
    authShow('Нет связи', 'Не получилось загрузить данные из облака', '<p class="muted">Проверь интернет и попробуй ещё раз.</p><button class="btn" id="authRetry">Попробовать снова</button>');
    $id('authRetry').onclick = () => { CL.uid = null; startCloud(user); };
    return;
  }
  await resolveUrls();
  beginApp();
}
function beginApp(){
  CL.ready = true; authHide();
  let L = null; try { if(!localStorage.getItem(cloudKey('migrated'))) L = legacyInfo(); } catch(err) {}
  if(L){ CL.seedHeld = true; prepLight(); } else { prepHabits(); prepBlog(); }
  setStatus(CL.status || 'ok');
  persist(); render();
  if(L) openMigrate(L);
}
async function boot(){
  if(!window.supabase || !window.supabase.createClient){
    authShow('Нет связи', 'Не удалось загрузить модуль входа', '<p class="muted">Проверь интернет и обнови страницу.</p><button class="btn" onclick="location.reload()">Обновить</button>');
    return;
  }
  CL.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'da_cloud_auth'}});
  CL.sb.auth.onAuthStateChange((ev) => setTimeout(() => {
    if(ev==='PASSWORD_RECOVERY') authNewPassword();
    else if(ev==='SIGNED_OUT' && CL.uid && !CL.leaving) location.reload();
  }, 0));
  let session = null;
  try { const r = await CL.sb.auth.getSession(); session = r.data && r.data.session; } catch(err) {}
  if(/access_token|refresh_token|type=|error_description/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#' + view);
  if(RECOVERY && session){ authNewPassword(); return; }
  if(session) startCloud(session.user); else authLogin();
}

/* фоновая синхронизация: раз в 30 секунд, при возвращении во вкладку и при появлении интернета */
setInterval(() => { if(CL.ready && document.visibilityState==='visible') cloudSync(); }, 30000);
document.addEventListener('visibilitychange', () => { if(!CL.ready) return; if(document.visibilityState==='visible') cloudSync(); else cloudPush(); });
window.addEventListener('online', () => cloudSync());
setInterval(() => { if(CL.needRender && !isModalOpen() && !isTyping()){ CL.needRender = false; render(); } }, 1500);

/* =========================================================
   НАВИГАЦИЯ И ОТРИСОВКА
   ========================================================= */
const VIEWS = {home:vHome, blog:vBlog, journal:vJournal, self:vSelf, travel:vTravel};
let view = (location.hash||'').slice(1);
if(!VIEWS[view]) view = 'home';

function go(v){
  if(!VIEWS[v]) v = 'home';
  view = v;
  if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(VIEWS[v] && v!==view) go(v); });

function render(){
  document.getElementById('app').innerHTML = VIEWS[view]();
  document.getElementById('nav').innerHTML = NAV.map(([k,l,s,i]) =>
    `<button class="${k===view?'on':''}" data-a="nav" data-v="${k}"><span class="ico">${i}</span><span class="nl">${l}</span><span class="ns">${s}</span></button>`).join('');
}

/* перерисовка главной раз в минуту (приветствие, смена дня) */
let lastDay = T();
setInterval(() => {
  if(T()!==lastDay) lastDay = T();
  const active = document.activeElement;
  if(!document.getElementById('modalRoot').innerHTML && !(active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) && view==='home') render();
}, 60000);

function prepHabits(){ S.habits.forEach(fixHabit); seedHabits(); }
boot();
</script>
