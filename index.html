<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой кабинет</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/icons/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta name="apple-mobile-web-app-title" content="Кабинет">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#E3E7DE;--card:#fff;--green:#1F3A12;--lilac:#C98FD3;--lime:#B6D98C;
  --text:#1b2416;--muted:#6b7563;--soft:#f4f6f1;--line:#eef1ea;--r:28px;
  --shadow:0 10px 30px rgba(31,58,18,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--green);font-weight:700}
h1,h2,h3{font-family:inherit}

/* ---------- верх / меню ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(227,231,222,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 20px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;color:var(--green);white-space:nowrap}
.brand i{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--lime),var(--lilac));display:inline-block}
.nav{display:flex;gap:4px;background:#fff;padding:6px;border-radius:999px;box-shadow:var(--shadow);margin:0 auto}
.nav button{border:0;background:none;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;display:flex;gap:7px;align-items:center;transition:.15s}
.nav button:hover{color:var(--green)}
.nav button.on{background:var(--green);color:#fff}
.nav .ico{font-size:16px}
.nav .ns{display:none}
main{max-width:1240px;margin:0 auto;padding:6px 20px 60px}

/* ---------- шапки разделов ---------- */
.hero{border-radius:var(--r);padding:30px 34px;background:linear-gradient(120deg,#B6D98C 0%,#cfdcb8 38%,#dcc6e1 72%,#C98FD3 100%);margin:10px 0 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.22)}
.hero-k{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#3c5a2a}
.hero h1{font-size:clamp(32px,5.4vw,56px);line-height:1;letter-spacing:-.04em;font-weight:800;margin:8px 0 8px;color:var(--green)}
.hero-sub{margin:0;font-weight:600;color:#33452a;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.62);border-radius:20px;padding:12px 18px;min-width:140px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.035em;color:var(--green);line-height:1.15}
.stat span{font-size:12.5px;color:#3d4a35;font-weight:600}

/* ---------- сетка и карточки ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}
.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:1/-1}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--green)}
.glow{box-shadow:0 0 0 3px var(--lilac),var(--shadow)}
.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.gap{gap:8px;flex-wrap:wrap}
.mb{margin-bottom:16px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.sp{flex:1}
.empty{color:var(--muted);padding:6px 0;margin:0}

/* ---------- кнопки и поля ---------- */
.btn{background:var(--green);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.25)}
.btn.ghost{background:#eef1ea;color:var(--green)}
.btn.ghost:hover{background:var(--lime);filter:none}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.danger{background:#fbe7e3;color:#a33b2a}
.ic{width:32px;height:32px;border-radius:50%;border:0;background:#f1f3ee;color:var(--green);font-weight:800;font-size:15px;cursor:pointer;flex:none;display:grid;place-items:center;transition:.15s}
.ic:hover{background:var(--lime)}
.ic.plus{background:var(--green);color:#fff;font-size:18px}
.ic:disabled,.chip:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;border:1.5px solid #e1e5dc;border-radius:16px;padding:10px 14px;background:#fafbf8;width:100%;color:inherit;outline:none;transition:.15s}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--lilac);background:#fff;box-shadow:0 0 0 4px rgba(201,143,211,.18)}
select:disabled{opacity:.6}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid #cbd3c3;background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;padding:0;transition:.15s}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on::after{content:'✓';color:#fff;font-size:14px;font-weight:800;line-height:1}
.sw{width:48px;height:28px;border-radius:999px;background:#dfe4d9;position:relative;border:0;cursor:pointer;flex:none;transition:.2s;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
.scale{display:flex;gap:6px}
.scale button{flex:1;height:44px;border-radius:14px;border:0;background:#eef1ea;font-weight:800;font-size:16px;cursor:pointer;color:var(--green);transition:.15s}
.scale button:hover{background:#e3ead9}
.scale button.on{background:var(--lilac);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:#eef1ea;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--green);transition:.15s}
.chip:hover{background:#e3ead9}
.chip.on{background:var(--green);color:#fff}
.badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eef1ea;color:var(--green);margin-right:4px}
.badge.ig{background:#f3e3f6;color:#7d3a8a}
.badge.tt{background:#e6f3d6;color:#2f5a13}
.badge.morning{background:#fff1c9;color:#7a5a00}
.badge.evening{background:#e7defa;color:#4c3a86}
.badge.free{background:#e6f3d6;color:#2f5a13}
.bar{height:10px;border-radius:99px;background:#eef1ea;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--lilac));border-radius:99px;transition:width .3s}
.bar.big{height:12px;margin:12px 0 6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tabs .tab{border:0;background:rgba(255,255,255,.65);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;color:var(--green)}
.tabs .tab.on{background:#fff;box-shadow:var(--shadow);color:var(--green);outline:2px solid var(--green)}
.note{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f6eef8;border-radius:16px;padding:10px 14px;margin:10px 0;font-weight:600;font-size:14px;flex-wrap:wrap}

/* ---------- главная ---------- */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.slot{background:#f7f9f4;border-radius:22px;padding:14px}
.slot-h{font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;color:var(--green)}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e9ede4}
.task .tt{flex:1;cursor:pointer;word-break:break-word;min-width:0}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .ic{width:28px;height:28px;font-size:13px;background:#fff}
.task .ic:hover{background:var(--lime)}
.dsw{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dsw button{border:0;background:#f1f4ec;color:var(--green);font:inherit;font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.dsw button:hover{background:var(--lime)}
.dsw button.on{background:var(--green);color:#fff}
.dsw-d{margin-left:6px;font-weight:700;font-size:13px;color:var(--muted)}
.plan-hint{margin:-6px 0 12px}
@media(max-width:760px){.dsw{width:100%}.dsw button{flex:1;padding:9px 6px}.dsw-d{width:100%;margin:4px 0 0;text-align:center}}
.task .drag{flex:none;width:18px;height:28px;margin-right:-4px;display:grid;place-items:center;border-radius:8px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#b7c0ae}
.task .drag i{width:8px;height:14px;background:radial-gradient(circle,currentColor 1.4px,transparent 1.6px) 0 0/4px 4.67px}
.task .drag:hover,.task .drag:focus-visible{color:var(--green);background:#f1f5ec;outline:none}
.task.dragging{position:relative;z-index:5;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(60,80,40,.16);border-bottom-color:transparent}
.task.dragging .drag{cursor:grabbing;color:var(--green)}
body.dragging-task,body.dragging-task *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
@media(max-width:760px){.task .drag{width:26px;height:34px;margin:0 -6px 0 -6px}}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.addrow input{padding:8px 12px;border-radius:14px}
.timer{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.tdisp{font-size:64px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--green);line-height:1;margin-bottom:6px}
.hbar{display:grid;grid-template-columns:110px 1fr 74px;align-items:center;gap:10px;margin:7px 0;font-size:14px;font-weight:600}
.hbar b{text-align:right;font-size:13px}
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hname{flex:1;display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
.hemo{width:42px;height:42px;border-radius:14px;background:#f1f3ee;display:grid;place-items:center;font-size:20px;flex:none}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#e4e8df}
.dots i.on{background:var(--lime)}
.dots i.miss{background:#f2cbc3}
.dots i.off,.dots i.fut{background:none;box-shadow:inset 0 0 0 1.5px #e4e8df}
.streak{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;text-align:right}
.streak .bar{height:6px;width:86px;margin:5px 0 0 auto}
.hplan{font-size:12px;color:var(--muted);font-weight:600}
.hcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hcal .calh{padding:2px 0}
.hc{aspect-ratio:1;border-radius:12px;border:0;display:grid;place-items:center;font-weight:800;font-size:14px;cursor:pointer;background:#f4f6f1;color:var(--green);padding:0;transition:.15s}
.hc:hover{filter:brightness(.96)}
.hc.on{background:var(--green);color:#fff}
.hc.miss{background:#fbe4df;color:#a33b2a}
.hc.off{background:none;box-shadow:inset 0 0 0 1.5px #e4e8df;color:var(--muted)}
.hc.fut{opacity:.35;cursor:default}
.hc.out{visibility:hidden}
.hc.today{outline:2px solid var(--lilac);outline-offset:1px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.hs{background:#f7f9f4;border-radius:18px;padding:12px 14px}
.hs b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--green)}
.hs span{font-size:12px;color:var(--muted);font-weight:600}
.hlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.hlegend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
@media(max-width:760px){.hstats{grid-template-columns:1fr 1fr}}

/* ---------- блог ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{background:rgba(255,255,255,.5);border-radius:24px;padding:12px;min-width:0}
.kh{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px;color:var(--green)}
.cnt{background:#fff;border-radius:99px;padding:1px 10px;font-weight:800;font-size:13px}
.icard{background:#fff;border-radius:18px;padding:13px;box-shadow:0 4px 14px rgba(31,58,18,.06);margin-bottom:10px;cursor:pointer;transition:.15s}
.icard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,58,18,.1)}
.it{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.015em;margin:8px 0 4px;line-height:1.25;color:var(--text)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 8px}
.mini{font-size:12px;color:var(--muted);font-weight:700}
.kadd{width:100%;border:2px dashed #cdd6c4;background:none;border-radius:16px;padding:9px;font-weight:700;color:var(--muted);cursor:pointer}
.kadd:hover{border-color:var(--green);color:var(--green)}
.kadd.sm{padding:3px;border-width:1.5px;font-size:13px;border-radius:10px}
.pill{font-size:12px;font-weight:700;border-radius:9px;padding:4px 8px;margin-bottom:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#eef1ea}
.pill.ig{background:#f3e3f6}
.pill.tt{background:#e6f3d6}
.pill.both{background:linear-gradient(90deg,#f3e3f6,#e6f3d6)}
.pill.pub{opacity:.6}
.pill em{font-style:normal;opacity:.6;font-size:11px;font-weight:600}
.wk{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr);gap:8px}
.wkh{font-weight:800;padding:4px 8px;color:var(--green)}
.wkd{background:#f7f9f4;border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.wkd.today{background:var(--lime)}
.wkd span{font-size:12px;color:var(--muted)}
.wkd.today span{color:var(--green)}
.wkc{background:#fbfcfa;border:1.5px solid var(--line);border-radius:14px;padding:6px;min-height:58px;min-width:0}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calh{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.cday{min-height:100px;background:#f7f9f4;border-radius:14px;padding:6px;cursor:pointer;min-width:0;transition:.15s}
.cday:hover{background:#edf2e5}
.cday.out{opacity:.45}
.cday.today{box-shadow:inset 0 0 0 2px var(--lilac)}
.cn{font-size:12px;font-weight:800;display:block;margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 8px;border-bottom:1px solid #f1f3ee;white-space:nowrap}
.tbl tr[data-a]{cursor:pointer}
.tbl tr[data-a]:hover td{background:#f7f9f4}
.tbl tfoot td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto}

/* ---------- результаты роликов ---------- */
.rsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.rs{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.rs b{display:block;font-size:26px;font-weight:800;letter-spacing:-.035em;color:var(--green);line-height:1.15}
.rs span{font-size:12.5px;color:var(--muted);font-weight:600}
.rbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.rbar select{width:auto;padding:8px 12px;border-radius:999px;background:#fff;font-weight:700;font-size:13.5px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.post{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.post:hover{transform:translateY(-2px)}
.post.sel{box-shadow:0 0 0 3px var(--lilac),var(--shadow)}
.pcover{aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--lime),var(--lilac));display:grid;place-items:center;font-size:26px;color:#fff;font-weight:800}
.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.pm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin:8px 0;font-size:13px}
.pm span{color:var(--muted);font-weight:600}
.pm b{color:var(--text)}
.cmpbtn{border:0;background:#f1f3ee;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--green);cursor:pointer}
.cmpbtn.on{background:var(--lilac);color:#fff}
.phead{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:start}
.phead h3{margin:6px 0 4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.mgrid .hs b{font-size:19px}
.delta{font-size:11px;font-weight:800;color:#3c7a1c;margin-left:4px}
.delta.neg{color:#a33b2a}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.shot{position:relative;border-radius:14px;overflow:hidden;background:#f4f6f1;aspect-ratio:9/16}
.shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.shot-act{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.shot-act .ic{width:28px;height:28px;font-size:13px;background:rgba(255,255,255,.9)}
.missing{display:grid;place-items:center;height:100%;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.tbl td.best{background:#eaf4de;font-weight:800}
.lb{position:fixed;inset:0;background:rgba(10,15,8,.9);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82vh;border-radius:16px;object-fit:contain}
.lb-bar{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700}
.lb-bar .ic{background:rgba(255,255,255,.9)}
@media(max-width:1000px){.rsum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  .plist{grid-template-columns:minmax(0,1fr)}
  .phead{grid-template-columns:96px minmax(0,1fr);gap:12px}
  .rs b{font-size:21px}
}

/* ---------- journaling ---------- */
.bigbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bigbtn{border:0;border-radius:22px;padding:18px 14px;background:#f4f6f1;font-weight:800;font-size:15px;cursor:pointer;text-align:left;color:var(--green);transition:.15s}
.bigbtn:hover{background:#eaf0e2}
.bigbtn small{display:block;font-weight:600;color:var(--muted);margin-top:4px;font-size:12.5px}
.bigbtn.done{background:linear-gradient(135deg,var(--lime),#d8ecc0)}
.qcard{background:linear-gradient(135deg,#f3e3f6,#eaf4de)}
.qtext{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.25;margin:6px 0 18px;color:var(--green)}
.entry{background:#f9faf7;border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.entry:hover{background:#f1f5ec}
.prompt{font-style:italic;color:#6d4f75;margin:8px 0 4px;font-weight:700;font-size:14px}
.etext{white-space:pre-wrap;margin:6px 0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mood{font-size:20px}
.dgroup{font-weight:800;margin:20px 0 8px;font-size:15px;color:var(--green)}
.emo{display:inline-block;font-size:11.5px;font-weight:700;background:#fff;border-radius:99px;padding:2px 9px;margin:4px 4px 0 0;color:var(--muted)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.wday{background:#f7f9f4;border-radius:16px;padding:10px 4px;text-align:center}
.wday b{display:block;font-size:12px;color:var(--muted)}
.wday span{font-size:22px;display:block;line-height:1.4}
.wday small{display:block;font-size:11px;color:var(--muted);font-weight:600}

/* ---------- саморазвитие ---------- */
.course{background:#f9faf7;border-radius:24px;padding:18px;margin-bottom:14px}
.ct{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--green)}
.mod{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #e9ede4;flex-wrap:wrap}
.mn{width:26px;height:26px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.mt{flex:1;cursor:pointer;font-weight:600;min-width:140px}
.mod.done .mt{color:var(--muted);text-decoration:line-through}
.book{cursor:pointer;background:#f9faf7;border-radius:22px;padding:16px;transition:.15s}
.book:hover{background:#f1f5ec}
.quote{font-style:italic;border-left:3px solid var(--lilac);padding-left:10px;margin:10px 0;color:#4a3d4f;font-size:14px}

/* ---------- окно (модалка) ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,15,.38);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .15s;overscroll-behavior:contain}
/* окно по высоте видимой области (на iPhone — над клавиатурой и панелями Safari); прокрутка не уходит на фон */
.modal-bg{bottom:auto;top:var(--vvt,0px);height:var(--vvh,100%)}
.modal{background:#fff;border-radius:28px;width:min(640px,100%);max-height:90vh;max-height:calc(100dvh - 32px);max-height:calc(var(--vvh,100dvh) - 32px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.2)}
/* пока открыто окно, страница под ним стоит на месте (iOS-надёжный способ) */
body.mlock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.modal.wide{width:min(780px,100%)}
.modal h3{margin:0 0 16px;font-size:25px;font-weight:800;letter-spacing:-.03em;color:var(--green)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.f.half{grid-column:auto}
.f>span{font-size:12.5px;font-weight:800;color:var(--muted)}
.fh{font-weight:800;font-size:15px;color:var(--green);margin-top:8px;padding-top:14px;border-top:1.5px solid var(--line);grid-column:1/-1}
.fhint{font-size:12.5px;color:var(--muted);margin-top:-8px;grid-column:1/-1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.mfoot .danger{margin-right:auto}
.stack{display:grid;gap:10px;margin-top:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- адаптив ---------- */
@media(max-width:1000px){
  .span-4,.span-5,.span-7,.span-8{grid-column:span 6}
  .slots{grid-template-columns:1fr}
  .timer{grid-template-columns:1fr}
}
@media(max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top-in{padding:12px 14px}
  .brand{flex:1;font-size:18px}
  .nav{position:fixed;bottom:10px;left:10px;right:10px;justify-content:space-between;border-radius:24px;z-index:30;padding:6px;margin:0;padding-bottom:calc(6px + env(safe-area-inset-bottom)/2)}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:8px 2px;flex:1;border-radius:18px}
  .nav .ico{font-size:19px}
  .nav .nl{display:none}
  .nav .ns{display:inline}
  main{padding:4px 12px 116px}
  .grid{gap:14px}
  .grid>*{grid-column:1/-1 !important}
  .hero{padding:24px 22px}
  .stat{min-width:0;flex:1 1 40%;padding:10px 14px}
  .stat b{font-size:22px}
  .card{padding:18px}
  .tdisp{font-size:54px}
  .bigbtns{grid-template-columns:1fr}
  .wk{grid-template-columns:62px minmax(0,1fr) minmax(0,1fr);gap:6px}
  .cday{min-height:64px;padding:4px;border-radius:10px}
  .cday .pill{font-size:9.5px;padding:2px 4px;border-radius:6px}
  .hbar{grid-template-columns:90px 1fr 64px}
  .modal-bg{align-items:flex-end;padding:0}
  .modal,.modal.wide{border-radius:28px 28px 0 0;max-height:92vh;max-height:calc(100dvh - 10px);max-height:calc(var(--vvh,100dvh) - 10px);padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%}
  .toast{bottom:104px}
  .tabs .tab{padding:8px 14px}
}

/* ---------- путешествия ---------- */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tbar .tabs{margin:0}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.trip{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:.15s;display:flex;flex-direction:column;min-width:0}
.trip:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(31,58,18,.12)}
.trip-band{height:10px;background:linear-gradient(90deg,var(--lime),var(--lilac))}
.trip.done .trip-band{background:#dfe4d9}
.trip-in{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.trip-t{font-size:20px;font-weight:800;letter-spacing:-.025em;color:var(--green);line-height:1.2;word-break:break-word}
.trip-m{font-size:14px;font-weight:600;word-break:break-word}
.trip-m.muted{font-weight:500}
.tst{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tst.plan{background:#eef1ea;color:var(--green)}
.tst.soon{background:#f3e3f6;color:#7d3a8a}
.tst.now{background:var(--lime);color:var(--green)}
.tst.done{background:#eceee9;color:var(--muted)}
.trip-nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0 0}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:start}
.day-sub{font-size:13px;font-weight:700;color:var(--muted)}
.stop{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.stop-time{flex:none;width:52px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;padding-top:1px}
.stop-time.none{color:#cbd3c3}
.stop-b{flex:1;min-width:0;cursor:pointer}
.stop-b b{display:block;word-break:break-word;line-height:1.3}
.stop-d{margin:4px 0 0;color:var(--muted);font-size:14px;white-space:pre-wrap;word-break:break-word}
.stop-map{display:inline-block;margin-top:6px;font-size:13px;white-space:nowrap}
.stop-act{display:flex;gap:4px;flex:none}
.stop-act .ic{width:28px;height:28px;font-size:13px}
@media(max-width:760px){
  .trips,.days{grid-template-columns:minmax(0,1fr);gap:14px}
  .tbar{gap:8px}
  .tbar .btn{width:100%}
  .stop{gap:10px}
  .stop-time{width:44px;font-size:14px}
}

/* ---------- документы поездки ---------- */
a.btn{text-decoration:none;display:inline-block}
.docs{display:grid;gap:12px}
.docs .lbl{margin:10px 0 0}
.doc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.doc-th{width:56px;height:56px;border-radius:16px;background:linear-gradient(160deg,var(--lime),var(--lilac));display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;overflow:hidden;cursor:pointer}
.doc-th.pdf{font-size:14px;letter-spacing:.04em}
.doc-th.link{background:#f3e3f6}
.doc-th img{width:100%;height:100%;object-fit:cover;display:block}
.doc-b{min-width:0;cursor:pointer}
.doc-b b{display:block;word-break:break-word;line-height:1.3}
.doc-n{margin:4px 0 0;font-size:13.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.doc-img{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:16px}
.doc-frame{display:block;width:100%;height:70vh;border:0;border-radius:16px;background:#f4f6f1}
.doc-pdf-m{text-align:center;padding:26px 18px;background:#f7f9f4;border-radius:20px}
.doc-pdf-m b{display:block;font-size:42px;margin-bottom:6px}
.doc-pdf-m p{margin:0 0 14px;color:var(--muted);font-size:14px}
.ups{display:grid;gap:10px}
.up{background:#f7f9f4;border-radius:16px;padding:10px 14px}
.up .bar{margin:8px 0 4px;height:8px}
.up-n{word-break:break-all;font-size:14px}
.up-s.err{color:#a33b2a;font-weight:700}
@media(max-width:760px){
  .doc{grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px}
  .doc-th{width:48px;height:48px;border-radius:14px}
  .doc-act{grid-column:1/-1;justify-content:flex-start}
  .doc-frame{height:62vh}
}

/* ---------- проживание в маршруте ---------- */
.stays{display:grid;gap:8px;margin-bottom:6px}
.stay{display:flex;gap:10px;align-items:flex-start;background:#f7f9f4;border-radius:16px;padding:10px 12px}
.stay.in{background:#eaf4de}
.stay.out{background:#f6eef8}
.stay-i{flex:none;font-size:18px;line-height:1.3}
.stay-b{flex:1;min-width:0;line-height:1.35}
.stay-l{font-weight:700;color:var(--muted)}
.stay-h{border:0;background:none;padding:0;font:inherit;font-weight:800;color:var(--green);text-decoration:underline;text-decoration-color:var(--lilac);text-underline-offset:3px;cursor:pointer;text-align:left;word-break:break-word}
.stay-t{display:inline-block;font-size:12.5px;font-weight:800;color:var(--green);background:#fff;border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.card.swap{box-shadow:0 0 0 3px var(--lime),var(--shadow)}
.swap-b{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--lime);color:var(--green);margin-top:6px}
.doc.flash{box-shadow:0 0 0 3px var(--lilac),var(--shadow)}
.f.off{display:none}

/* ---------- рейсы и пересадки ---------- */
.fsum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fsum span{font-size:12px;font-weight:800;background:#eef1ea;color:var(--green);border-radius:999px;padding:2px 9px;white-space:nowrap}
.fsum span.warn{background:#fbe7e3;color:#a33b2a}
.fls{display:grid;gap:10px;margin:6px 0 4px}
.fl{background:#f7f9f4;border-radius:20px;padding:14px 16px}
.fl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fl-h b{color:var(--green);font-size:16px}
.fl-r{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.fl-p{display:flex;flex-direction:column;gap:1px;min-width:0}
.fl-p.r{text-align:right;align-items:flex-end}
.fl-p b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
.fl-p span{font-weight:700;word-break:break-word}
.fl-p em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.fl-d{text-align:center;font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.fl-d i{display:block;height:2px;min-width:40px;background:linear-gradient(90deg,var(--lime),var(--lilac));margin:4px 0;border-radius:2px}
.nd{display:inline-block;font-size:11px;font-weight:800;background:var(--lilac);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:2px}
.lay{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;color:var(--green);font-size:14px;padding:4px 0}
.lay small{font-weight:600;color:var(--muted)}
.fwarn{background:#fbe7e3;color:#a33b2a;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;margin-top:8px}
.fnote{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:8px}
.ftot{background:linear-gradient(120deg,#e6f3d6,#f3e3f6);border-radius:18px;padding:12px 16px;font-weight:800;color:var(--green);margin-top:12px}
.ftot small{display:block;font-weight:600;color:#4b5a43;font-size:12.5px}
.stay.dep,.stay.arr{background:#eef1fb}
@media(max-width:760px){.fl{padding:12px}.fl-p b{font-size:19px}.fl-r{gap:6px}}

/* ---------- главная: календарь задач и отчёты дня ---------- */
.cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cal-nav .ic{width:30px;height:30px}
.cal-t{font-weight:800;color:var(--green);min-width:0}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cd{border:0;background:#f4f6f1;border-radius:14px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--green);font-weight:800;font-size:14px;position:relative;min-width:0;min-height:54px;transition:.15s;font-family:inherit}
.cd:hover{background:#eaf0e2}
.cd.out{opacity:.4}
.cd.today{box-shadow:inset 0 0 0 2px var(--lilac)}
.cd.sel{background:var(--green);color:#fff}
.cd-dots{display:flex;gap:3px;height:6px;align-items:center}
.cd-dots i{width:6px;height:6px;border-radius:50%;background:var(--lilac)}
.cd-dots i.on{background:var(--lime)}
.cd-dots b{font-size:9px;line-height:6px;color:var(--muted)}
.cd.sel .cd-dots b{color:#dfe6d6}
.cd.rep::after{content:'✓';position:absolute;top:2px;right:5px;font-size:10px;font-weight:800;color:#3c7a1c}
.cd.sel.rep::after{color:var(--lime)}
.cd.reo::after{content:'↺';position:absolute;top:1px;right:5px;font-size:11px;font-weight:800;color:#7d3a8a}
.cd.sel.reo::after{color:var(--lilac)}
.badge.soon{background:#f3e3f6;color:#7d3a8a}
.cal-day{margin-top:14px;background:#f7f9f4;border-radius:22px;padding:14px 16px}
.cal-bar{margin-top:12px;padding:10px 14px;background:#f7f9f4;border-radius:18px}
.cal-bar-r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cal-bar.open{border-radius:18px 18px 0 0;padding-bottom:6px}
.cal-bar-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.cal-bar .btn{flex:none}
.cal-bar-t b{color:var(--green)}
.cal-bar + .cal-day{margin-top:0;border-radius:0 0 22px 22px;padding-top:2px;border-top:1px solid #e9ede4}
.cd-dots i.tv{border-radius:2px;transform:rotate(45deg);background:var(--green);width:5px;height:5px;margin-left:2px}
.cd.sel .cd-dots i.tv{background:#fff}
.cd.nt::before{content:'';position:absolute;left:9px;right:9px;bottom:3px;height:3px;border-radius:3px;background:#dcc6e1}
.cd.sel.nt::before{background:var(--lilac)}
.cal-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.cal-leg i.lg{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:5px;vertical-align:0}
.cal-leg i.lg.tv{border-radius:2px;transform:rotate(45deg);background:var(--green);width:6px;height:6px}
.cal-leg i.lg.nt{width:14px;height:3px;border-radius:3px;background:#dcc6e1;vertical-align:2px}
@media(max-width:760px){.cal-bar{padding:9px 12px}.cal-leg{gap:4px 9px;font-size:11px}}
.cal-day .tev,.slot .tev{margin:6px 0}
.stay.mini{padding:5px 12px;font-size:13px;background:transparent}
.stop.flash{background:#f6eef8;border-radius:14px;box-shadow:0 0 0 6px #f6eef8}
.cal-day .task{border-bottom-color:#e9ede4}
.cal-slot{flex:none;font-size:14px}
.cal-add select{width:auto;flex:none;padding:8px 10px;border-radius:14px}
.ci{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ci span{flex:1;min-width:0;word-break:break-word}
.ci.dis{opacity:.55}
.rep-k{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 6px}
.rep-orig{margin-top:14px;background:#f7f9f4;border-radius:18px;padding:10px 14px}
.rep-orig summary{cursor:pointer;font-weight:800;color:var(--green)}
.rep-l{white-space:pre-wrap;word-break:break-word;margin:4px 0 0}
@media(max-width:760px){
  .mcal{gap:4px}
  .cd{min-height:46px;border-radius:12px;font-size:13px;padding:7px 0 6px;gap:4px}
  .cd-dots i{width:5px;height:5px}
  .cal-day{padding:12px}
}

/* ---------- меню действий «⋯» ---------- */
.ic.more{font-size:18px;letter-spacing:1px;line-height:1}
.pop{position:fixed;z-index:120;background:#fff;border-radius:18px;box-shadow:0 18px 44px rgba(31,58,18,.2),0 0 0 1px rgba(31,58,18,.05);padding:6px;min-width:200px;max-width:calc(100vw - 16px);animation:fade .12s}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;font:inherit;font-weight:700;font-size:14.5px;color:var(--green);text-align:left;cursor:pointer;text-decoration:none;white-space:nowrap}
.mi:hover,.mi:focus-visible{background:#f4f6f1;outline:none}
.mi.danger{color:#a33b2a}
.mi.danger:hover{background:#fbe7e3}

/* ---------- саморазвитие: модуль, видео, материалы, домашка ---------- */
.lsec{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.lsec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:4px 0;font:inherit;cursor:pointer;color:var(--green);text-align:left}
.lsec-h b{font-size:16px;font-weight:800}
.lsec-h .mini{flex:1}
.lsec-b{margin-top:8px}
.mcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-top:14px}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mhead h1{margin:4px 0 2px;font-size:clamp(24px,4vw,34px);letter-spacing:-.03em;color:var(--green);line-height:1.1;word-break:break-word}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.vid{background:#f7f9f4;border-radius:20px;padding:10px;min-width:0}
.yt{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#1b2416}
.yt.short{aspect-ratio:9/16;width:min(100%,260px);margin:0 auto}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-thumb{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;background:#1b2416 center/cover no-repeat}
.yt-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:44px;border-radius:14px;background:rgba(31,58,18,.88);color:#fff;font-size:20px;display:grid;place-items:center}

  const DEMO = {

  d.ideas = arr('ideas').filter(x => !has(DEMO.ideas, x.title));

  ['Работа над блогом','🎬','Засчитывается любой конкретный шаг: идея, сценарий, съёмка, монтаж','weekly',5],
  ['Обучение','🎓','Курсы, лекции, повторение материала','weekly',3],
  ['Физическая активность','🏃‍♀️','Прогулка, тренировка или другая активность','daily',3],
  ['Чтение','📖','Минимум 10 минут','weekly',3]
];
const wdi = k => (parseD(k).getDay()+6)%7;
function fixHabit(h){
  if(!['daily','days','weekly'].includes(h.freq)) h.freq = 'daily';
  if(!Array.isArray(h.days)) h.days = [];
  h.times = Math.min(7, Math.max(1, Math.round(+h.times) || 3));
  if(h.desc == null) h.desc = '';
  if(h.emoji == null) h.emoji = '';
  if(!h.created){ const logged = Object.keys(S.habitLog).filter(k => S.habitLog[k].includes(h.id)).sort(); h.created = logged[0] || T(); }
  return h;
}
/* стартовые привычки добавляются один раз; повторно не создаются никогда */
function seedHabits(){
  if(S.habitsSeeded) return;
  BASE_HABITS.forEach(([name,emoji,desc,freq,times]) => {
    const ex = S.habits.find(h => (h.name||'').trim().toLowerCase()===name.toLowerCase());
    if(ex) Object.assign(ex, {desc: ex.desc || desc, emoji: ex.emoji || emoji, freq, days:[], times});
    else S.habits.push({id:uid(), name, emoji, desc, freq, days:[], times, created:T()});
  });
  S.habitsSeeded = 1;
}
function hPlanned(h,k){ return h.freq==='daily' || (h.freq==='days' && h.days.includes(wdi(k))); }
function hTarget(h){ return h.freq==='daily' ? 7 : h.freq==='days' ? h.days.length : h.times; }
function hWeekCount(h,ws){ let c = 0; for(let i=0;i<7;i++) if(hDone(addDays(ws,i),h.id)) c++; return c; }
function hStreak(h){
  if(h.freq!=='daily') return 0;
  let k = T(), s = 0; if(!hDone(k,h.id)) k = addDays(k,-1);
  while(hDone(k,h.id)){ s++; k = addDays(k,-1); } return s;
}
function hBestStreak(h){
  if(h.freq!=='daily') return 0;
  const ks = Object.keys(S.habitLog).filter(k => S.habitLog[k].includes(h.id)).sort();
  let best = 0, cur = 0, prev = null;
  ks.forEach(k => { cur = prev && addDays(prev,1)===k ? cur+1 : 1; best = Math.max(best,cur); prev = k; });
  return best;
}
/* статус дня: on — выполнено, miss — запланировано и пропущено,
   todo — сегодня ещё можно, off — не запланировано / до старта привычки, fut — будущее, free — свободный день у «X раз в неделю» */
function hState(h,k){
  const t = T();
  if(hDone(k,h.id)) return 'on';
  if(k>t) return 'fut';
  if(k<h.created) return 'off';
  if(h.freq==='weekly') return k===t ? 'todo' : 'free';
  if(!hPlanned(h,k)) return 'off';
  return k===t ? 'todo' : 'miss';
}
/* выполнение за период до сегодняшнего дня (дни до создания привычки не учитываются) */
function hRange(h,from,to){
  const t = T(), start = from<h.created ? h.created : from, end = to>t ? t : to;
  let done = 0, planned = 0, n = 0;
  for(let k=from;k<=end;k=addDays(k,1)) if(hDone(k,h.id)) done++;
  for(let k=start;k<=end;k=addDays(k,1)){ n++; if(hPlanned(h,k)) planned++; }
  if(h.freq==='weekly') planned = n ? Math.max(1, Math.round(h.times*n/7)) : 0;
  return {done, planned, pct: planned ? Math.min(100, Math.round(done/planned*100)) : 0};
}
function hFreqLabel(h){
  if(h.freq==='daily') return 'Ежедневно';
  if(h.freq==='days') return h.days.slice().sort((a,b) => a-b).map(i => WD[i]).join(', ') || 'дни не выбраны';
  return h.times+' '+plural(h.times,'раз','раза','раз')+' в неделю';
}
/* нужна ли привычка сегодня: ежедневные и запланированные на сегодня,
   «X раз в неделю» — пока недельная цель не выполнена; отмеченные сегодня считаются всегда */
function hNeededToday(h,t){
  if(hDone(t,h.id)) return true;
  if(h.freq==='weekly') return hWeekCount(h,weekStart(t)) < h.times;
  return hPlanned(h,t);
}
function jStreak(){ const set = new Set(S.journal.map(e => e.date)); let k = T(), s = 0; if(!set.has(k)) k = addDays(k,-1); while(set.has(k)){ s++; k = addDays(k,-1); } return s; }
function avgMood(list){ const m = list.filter(e => e.mood); return m.length ? m.reduce((a,e) => a+e.mood, 0)/m.length : 0; }
function tElapsed(){ const t = S.timer; if(!t) return 0; return t.acc + (t.running ? Date.now()-t.start : 0); }
function platBadges(p){ p = p || ''; return (p.includes('Instagram') ? '<span class="badge ig">IG</span>' : '') + (p.includes('TikTok') ? '<span class="badge tt">TT</span>' : ''); }
function platClass(p){ p = p || ''; const ig = p.includes('Instagram'), tt = p.includes('TikTok'); return ig && tt ? 'both' : ig ? 'ig' : 'tt'; }

function hero(kicker, title, sub, stats){
  return `<section class="hero"><div class="hero-k">${kicker}</div><h1>${title}</h1>${sub ? `<p class="hero-sub">${sub}</p>` : ''}
  <div class="stats">${stats.map(([v,l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div></section>`;

function tabs(list, cur, action){
  return list.map(([v,l]) => `<button class="tab ${cur===v?'on':''}" data-a="${action}" data-v="${v}">${l}</button>`).join('');

function timerHtml(fw, fwMin){
  const tm = S.timer, running = tm && tm.running;
  const sec = tm ? tm.section : S.timerCfg.section, dur = tm ? tm.dur : S.timerCfg.dur;
  const rem = tm ? dur*60000 - tElapsed() : dur*60000;
  const bySec = FOCUS_SECTIONS.map(s => [s, fw.filter(f => f.section===s).reduce((a,f) => a+f.min, 0)]).filter(x => x[1]>0).sort((a,b) => b[1]-a[1]);
  const max = Math.max(1, ...bySec.map(x => x[1]));
  return `<div class="ch"><h2>Таймер фокуса</h2><span class="muted sm">${fmtMin(fwMin)} за неделю</span></div>
  <div class="timer">
    <div>
      <div class="tdisp" id="tdisp">${fmtClock(rem)}</div>
      <div class="muted sm" style="margin-bottom:14px">${tm ? (running ? 'Идёт сессия · ' : 'Пауза · ')+esc(sec) : 'Выбери раздел и нажми «Старт»'}</div>
      <div class="row gap">
        ${!tm || !running ? `<button class="btn" data-a="tStart">${tm ? 'Продолжить' : 'Старт'}</button>` : `<button class="btn" data-a="tPause">Пауза</button>`}
        ${tm ? `<button class="btn ghost" data-a="tStop">Стоп и записать</button>` : ''}
      </div>
    </div>
    <div>
      <div class="lbl" style="margin-top:0">Раздел</div>
      <select data-c="tSection" ${tm?'disabled':''}>${FOCUS_SECTIONS.map(s => `<option ${s===sec?'selected':''}>${s}</option>`).join('')}</select>
      <div class="lbl">Минут</div>
      <div class="chips">${[15,25,45,60,90].map(m => `<button class="chip ${dur===m?'on':''}" data-a="tDur" data-v="${m}" ${tm?'disabled':''}>${m}</button>`).join('')}</div>
    </div>
  </div>
  <div class="lbl">Время в фокусе за неделю</div>
  ${bySec.length ? bySec.map(([s,m]) => `<div class="hbar"><span>${s}</span><div class="bar"><i style="width:${m/max*100}%"></i></div><b>${fmtMin(m)}</b></div>`).join('')
    : '<p class="empty">Пока нет записей</p>'}`;
}

const METRICS = [
  ['views','Просмотры','Просм.'], ['reach','Охват','Охват'], ['likes','Лайки','Лайки'],
  ['comments','Комментарии','Комм.'], ['saves','Сохранения','Сохр.'], ['shares','Репосты','Репосты'],
  ['followers','Новые подписчики','+Подп.'], ['avgWatch','Ср. время просмотра, сек','Ср. время'], ['completion','Досмотры, %','Досмотры']
];
const POST_PLATS = [['','Не указана'],['Instagram','Instagram'],['TikTok','TikTok']];
const isNum = v => v!=='' && v!=null && !isNaN(+v);
function newPost(o){ return Object.assign({id:uid(), ideaId:null, platform:'', title:'', url:'', date:'', cover:null, shots:[], notes:'', snaps:[], created:Date.now()}, o||{}); }
function snapsSorted(p){ return (p.snaps||[]).slice().sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.ts||0)-(b.ts||0)); }
function latest(p){ const s = snapsSorted(p); return s.length ? s[s.length-1] : null; }
function pv(p,k){ const l = latest(p); return l && isNum(l[k]) ? +l[k] : null; }
function erOf(m){ if(!m || !isNum(m.views) || !+m.views) return null;
  const parts = ['likes','comments','saves','shares'].filter(k => isNum(m[k])); if(!parts.length) return null;
  return parts.reduce((a,k) => a+(+m[k]), 0)/(+m.views)*100; }
function fmtMetric(k,v){
  if(!isNum(v)) return '—';
  if(k==='avgWatch') return r1(v).toString().replace('.',',')+' с';
  if(k==='completion' || k==='er') return r1(v).toString().replace('.',',')+'%';
  return fmtN(v);
}
function platBadge(p){ return p==='Instagram' ? '<span class="badge ig">Instagram</span>' : p==='TikTok' ? '<span class="badge tt">TikTok</span>' : '<span class="badge">площадка не указана</span>'; }

/* связь с банком идей: при статусе «опубликовано» появляются записи — по одной на каждую площадку идеи, без дублей */
function ensurePosts(idea){
  if(!idea || idea.status!=='опубликовано') return 0;
  const plats = ['Instagram','TikTok'].filter(p => (idea.platform||'').includes(p));
  const linked = S.posts.filter(x => x.ideaId===idea.id);
  let n = 0;
  plats.forEach(pl => {
    if(linked.some(x => x.platform===pl) || linked.length + n >= plats.length) return;
    S.posts.push(newPost({ideaId:idea.id, platform:pl, title:idea.title, date:idea.date||''})); n++;
  });
  return n;
}

/* хранилище изображений: файлы лежат в приватной папке Supabase Storage,
   MEDIA — адреса для показа (id → ссылка с ограниченным сроком или только что сжатая картинка) */
const MKEY = 'da_cabinet_media_v1'; // старые картинки браузера: только читаются для переноса
let MEDIA = {};
function persistMedia(){ return true; }
function usedMediaIds(st){ const used = new Set(); ((st||S).posts||[]).forEach(p => { if(p.cover) used.add(p.cover); (p.shots||[]).forEach(x => x && used.add(x)); }); return used; }
function storageLine(){
  const n = usedMediaIds().size, wait = Object.keys(CL.pmedia).length;
  return `Изображения хранятся в облаке · ${n}${wait ? ` · ждут загрузки: ${wait}` : ''}`;
}
function putMedia(urls, freeIds){
  dropMedia(freeIds||[]);
  const ids = urls.map(u => { const id = 'm'+uid(); MEDIA[id] = u; CL.pmedia[id] = u; return id; });
  savePendingMedia();
  return ids;
}
function dropMedia(ids){
  const list = ids.filter(Boolean); if(!list.length) return;
  const remote = list.filter(id => !CL.pmedia[id]);
  list.forEach(id => { delete MEDIA[id]; delete CL.pmedia[id]; delete CL.urls[id]; });
  savePendingMedia(); saveUrls();
  if(remote.length && CL.sb && CL.uid) CL.sb.storage.from(SB_BUCKET).remove(remote.map(mediaPath)).catch(() => {});
}
function cleanMedia(){
  /* убирает из памяти ссылки на картинки, которые больше нигде не используются; файлы в облаке не трогает */
  const used = usedMediaIds();
  Object.keys(MEDIA).forEach(k => { if(!used.has(k) && !CL.pmedia[k]) delete MEDIA[k]; });
}
function compressImage(file, maxSide, quality){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let out = c.toDataURL('image/webp', quality);
      if(!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', quality);
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
const imgTag = (id, cls) => MEDIA[id] ? `<img src="${MEDIA[id]}" alt="" ${cls||''}>` : '<div class="missing">файл не найден</div>';

/* подготовка при загрузке: миграция старых цифр из карточек идей, стартовые записи (один раз), чистка */
function prepBlog(){
  if(!Array.isArray(S.posts)) S.posts = [];
  S.posts = S.posts.map(p => newPost(p));
  S.posts.forEach(p => { p.shots = (p.shots||[]).filter(Boolean); p.snaps = Array.isArray(p.snaps) ? p.snaps : []; });
  if(!S.postsMigrated){
    S.ideas.forEach(idea => {
      const old = ['views','likes','saves','comments','shares'].filter(k => +idea[k]>0);
      if(idea.status==='опубликовано') ensurePosts(idea);
      const first = S.posts.find(x => x.ideaId===idea.id);
      if(first && old.length){
        const snap = {id:uid(), date:idea.date || T(), ts:Date.now()};
        METRICS.forEach(([k]) => snap[k] = '');
        old.forEach(k => snap[k] = +idea[k]);
        first.snaps.push(snap);
      }
      if(first && (idea.resNote||'').trim() && !first.notes) first.notes = idea.resNote;
      ['views','likes','saves','comments','shares','resNote'].forEach(k => delete idea[k]);
    });
    S.postsMigrated = 1;
  }
  if(!S.blogSeeded){
    const hasIdea = t => S.ideas.some(x => (x.title||'').trim().toLowerCase()===t.toLowerCase());

      'Ощущение, что в 23 года я уже отстаю от сверстников, которые якобы достигли большего.',
      'Постоянное сравнение себя с другими, давление возраста, ощущение недостаточного прогресса.',
      'Собственный путь обесценивается из-за сравнения с чужими достижениями.'));
    if(!hasIdea('Copying Success')) S.ideas.push(idea('Copying Success',
      'Попытки повторять чужие стратегии успеха не гарантируют аналогичного результата.',
      'Разочарование, когда следуешь чужому примеру, но не получаешь такого же результата.',
      'Мы видим чужой успех, но не все обстоятельства и решения, которые к нему привели.'));
    if(!hasPost('The $35 Apartment')) S.posts.push(newPost({title:'The $35 Apartment', notes:'Результат не оправдал ожиданий.'}));
    if(!hasPost('100 Countries Before 30')) S.posts.push(newPost({title:'100 Countries Before 30', notes:'Результат не оправдал ожиданий.'}));
    S.blogSeeded = 1;
  }
  /* ссылки на картинки здесь не удаляются: файл может ещё загружаться с другого устройства */

}

function periodFrom(){

}
function postFiltered(){
  const from = periodFrom();
  const list = S.posts.filter(p => (UI.rplat==='all' || (UI.rplat==='none' ? !p.platform : p.platform===UI.rplat)) && (!from || (p.date && p.date>=from)));
  const byDate = (a,b) => (b.date||'').localeCompare(a.date||'') || (b.created||0)-(a.created||0);
  if(UI.rsort==='date') return list.sort(byDate);
  const k = UI.rsort;
  return list.sort((a,b) => { const x = pv(a,k), y = pv(b,k); if(x===null && y===null) return byDate(a,b); if(x===null) return 1; if(y===null) return -1; return y-x; });

let UPLOAD = null, LB = null;
function pickImages(kind, extra){
  UPLOAD = Object.assign({kind, postId:UI.post}, extra||{});
  const f = document.getElementById('mediaFile'); f.multiple = kind==='shots'; f.click();
}
async function handleImages(files){
  const up = UPLOAD; UPLOAD = null;
  const p = up && byId(S.posts, up.postId); if(!p || !files.length) return;
  const cover = up.kind==='cover';
  toast('Сжимаю изображения…');
  const urls = [];
  for(const f of files){ try { urls.push(await compressImage(f, cover ? 480 : 1400, cover ? 0.72 : 0.6)); } catch(err) {} }
  if(!urls.length){ alert('Не получилось открыть изображение. Попробуй JPG или PNG.'); return; }
  const full = 'Не хватает места в хранилище браузера. Удали лишние скриншоты или сделай экспорт и убери старые изображения.';
  if(cover){
    const ids = putMedia(urls.slice(0,1), p.cover ? [p.cover] : []);
    if(!ids){ alert(full); return; } p.cover = ids[0];
  } else if(up.kind==='replace'){
    const old = p.shots[up.i]; const ids = putMedia(urls.slice(0,1), old ? [old] : []);
    if(!ids){ alert(full); return; } p.shots[up.i] = ids[0];
  } else {
    let added = 0;
    for(const u of urls){ const ids = putMedia([u]); if(!ids) break; p.shots.push(ids[0]); added++; }
    if(added<urls.length) alert(`Добавлено ${added} из ${urls.length}. ${full}`);
  }
  persist(); render(); if(UI.post===p.id && document.getElementById('modalRoot').innerHTML) renderPostModal();
  toast('Изображения сохранены');
}
function showLB(){
  const el = document.getElementById('lightbox'), p = LB && byId(S.posts, LB.post), id = p && p.shots[LB.i];

}

  es.forEach(e => (e.emotions||[]).forEach(x => cnt[x] = (cnt[x]||0)+1));
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,6);
  const avg = avgMood(es);
  return `<div class="grid">
    <section class="card span-12"><div class="ch"><h2>Неделя ${fmtD(ws,{day:'numeric',month:'short'})} — ${fmtD(we,{day:'numeric',month:'short'})}</h2>

/* блокировка прокрутки страницы под окном: запоминаем позицию и возвращаем её после закрытия */
let MLOCK = null;
function lockScroll(){
  if(MLOCK!==null) return;
  MLOCK = window.scrollY || 0;
  document.body.style.top = -MLOCK+'px'; document.body.classList.add('mlock');
}
function unlockScroll(){
  if(MLOCK===null) return;
  const y = MLOCK; MLOCK = null;
  document.body.classList.remove('mlock'); document.body.style.top = '';
  window.scrollTo(0, y);
}
/* видимая область экрана (уменьшается, когда открыта клавиатура на телефоне) */
function vvSync(){
  const v = window.visualViewport, r = document.documentElement.style; if(!v) return;
  r.setProperty('--vvh', Math.round(v.height)+'px'); r.setProperty('--vvt', Math.round(v.offsetTop)+'px');
}
if(window.visualViewport){ visualViewport.addEventListener('resize', vvSync); visualViewport.addEventListener('scroll', vvSync); }
/* поле в окне, на котором появилась клавиатура, прокручиваем в видимую часть окна */
document.getElementById('modalRoot').addEventListener('focusin', e => {
  const el = e.target; if(!/INPUT|TEXTAREA|SELECT/.test(el.tagName)) return;
  setTimeout(() => { vvSync(); if(el.isConnected && document.activeElement===el) el.scrollIntoView({block:'center', behavior:'smooth'}); }, 350);
});

function fieldHtml(f, v){
  if(f.type==='h') return `<div class="fh">${esc(f.label)}</div>`;
  if(f.type==='hint') return `<div class="fhint"${f.id ? ` id="${f.id}"` : ''}>${esc(f.label)}</div>`;
  const cls = 'f'+(f.half ? ' half' : ''), ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  let inner;
  switch(f.type){
    case 'textarea': inner = `<textarea name="${f.k}" rows="${f.rows||3}"${ph}>${esc(v)}</textarea>`; break;
    case 'select': inner = `<select name="${f.k}">${f.options.map(o => { const [ov,ol] = Array.isArray(o) ? o : [o,o];
        return `<option value="${esc(ov)}"${String(ov)===String(v??'') ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`; break;
    case 'scale': inner = `<div class="scale" data-group="${f.k}">${[1,2,3,4,5].map(n => `<button type="button" data-a="scale" data-v="${n}" class="${+v===n?'on':''}">${f.labels ? f.labels[n-1] : n}</button>`).join('')}</div>`; break;
    case 'chips': inner = `<div class="chips" data-group="${f.k}">${f.options.map(o => `<button type="button" class="chip ${(v||[]).includes(o)?'on':''}" data-a="chip" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`; break;
    case 'check': inner = `<button type="button" class="sw ${v?'on':''}" data-a="swt" data-group="${f.k}"></button>`; break;
    case 'num': inner = `<input name="${f.k}" type="text" inputmode="decimal" value="${esc(v ?? '')}">`; break;
    default: inner = `<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}"${f.type==='number' ? ' step="any" inputmode="decimal"' : ''}${ph}>`;
  }
  return `<div class="${cls}" data-k="${f.k}"><span>${esc(f.label)}</span>${inner}</div>`;
}

  if(cfg.onInput) cfg.onInput(document.getElementById('mform'), '');

function collect(){
  const form = document.getElementById('mform'), out = {};
  FORM.fields.forEach(f => {
    if(!f.k) return;
    if(f.type==='scale'){ const b = form.querySelector(`[data-group="${f.k}"] .on`); out[f.k] = b ? +b.dataset.v : 0; }
    else if(f.type==='chips'){ out[f.k] = [...form.querySelectorAll(`[data-group="${f.k}"] .on`)].map(b => b.dataset.v); }
    else if(f.type==='check'){ out[f.k] = form.querySelector(`[data-group="${f.k}"]`).classList.contains('on'); }
    else if(f.type==='num'){ const raw = String(form.elements[f.k].value).trim().replace(/\s/g,'').replace(',','.'); const n = parseFloat(raw); out[f.k] = raw==='' || isNaN(n) ? '' : n; }
    else { const el = form.elements[f.k]; out[f.k] = f.type==='number' ? (parseFloat(String(el.value).replace(',','.')) || 0) : el.value; }
  });
  return out;
}

function beep(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx();
    [0, .35].forEach(delay => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.2, ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+delay+.3);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+.3);
    });
  } catch(err) {}
}
function finishTimer(complete){
  const t = S.timer; if(!t) return;
  const min = complete ? t.dur : Math.floor(tElapsed()/60000);
  if(min>=1) S.focus.push({id:uid(), date:T(), section:t.section, min});
  S.timer = null; save();
  toast(min>=1 ? `+${min} мин в фокусе · ${t.section}` : 'Сессия короче минуты — не записана');
  if(complete) beep();
}
setInterval(() => {
  if(S.timer && S.timer.running){
    const rem = S.timer.dur*60000 - tElapsed();
    if(rem<=0){ finishTimer(true); document.title = 'Мой кабинет'; return; }
    const el = document.getElementById('tdisp');
    if(el) el.textContent = fmtClock(rem);
    document.title = fmtClock(rem)+' · фокус';
  } else if(document.title!=='Мой кабинет') document.title = 'Мой кабинет';
}, 1000);

/* ---------- перетаскивание задач (ручной приоритет внутри «Утро / День / Вечер») ----------
   мышь — сразу за значок ⋮⋮; палец — удержанием за значок (~0,18 с). Остальная строка не трогает прокрутку.
   Двигать можно только среди задач той же группы: тот же день, та же часть дня, тот же статус. */
let DRAG = null;
function dragGroup(row){ return [...row.parentNode.children].filter(r => r.dataset && r.dataset.grp===row.dataset.grp); }
function applyTaskOrder(ids){
  /* меняем местами только эти задачи: они занимают те же позиции в S.tasks, что и раньше, в новом порядке */
  const objs = ids.map(id => S.tasks.find(x => String(x.id)===id)).filter(Boolean); if(objs.length < 2) return false;
  const idx = objs.map(o => S.tasks.indexOf(o)).sort((a,b) => a-b);
  if(idx.every((n,i) => S.tasks[n]===objs[i])) return false;
  idx.forEach((n,i) => { S.tasks[n] = objs[i]; });
  return true;
}
function dragStart(){
  const d = DRAG; d.on = true; d.pending = false;
  d.row.classList.add('dragging'); document.body.classList.add('dragging-task');
  d.y0 = d.y; d.top0 = d.row.getBoundingClientRect().top;
  try { d.h.setPointerCapture(d.pid); } catch(err) {}
  if(d.touch && navigator.vibrate) try { navigator.vibrate(8); } catch(err) {}
  d.timer = setInterval(dragAuto, 16);
}
function dragMove(){
  const d = DRAG, row = d.row, grp = dragGroup(row);
  const mid = d.y - (d.y0 - d.top0) + row.offsetHeight/2; /* центр строки там, где палец */
  let i = grp.indexOf(row);
  while(i > 0){ const r = grp[i-1].getBoundingClientRect(); if(mid < r.top + r.height/2){ row.parentNode.insertBefore(row, grp[i-1]); grp.splice(i,1); grp.splice(i-1,0,row); i--; } else break; }
  while(i < grp.length-1){ const r = grp[i+1].getBoundingClientRect(); if(mid > r.top + r.height/2){ row.parentNode.insertBefore(row, grp[i+1].nextSibling); grp.splice(i,1); grp.splice(i+1,0,row); i++; } else break; }
  /* строка не уезжает за пределы своей группы */
  const first = grp[0].getBoundingClientRect(), last = grp[grp.length-1].getBoundingClientRect();
  row.style.transform = 'none';
  const natural = row.getBoundingClientRect().top;
  const want = Math.min(Math.max(d.y - (d.y0 - d.top0), Math.min(first.top, natural) - 4), Math.max(last.top, natural) + 4);
  row.style.transform = `translateY(${Math.round(want - natural)}px)`;
}
function dragAuto(){
  const d = DRAG; if(!d || !d.on) return;
  const nav = document.getElementById('nav'), nb = nav ? nav.getBoundingClientRect() : null;
  const bottom = nb && nb.top > innerHeight/2 ? nb.top : innerHeight, edge = 56;
  const v = d.y < edge ? -Math.ceil((edge - d.y)/4) : d.y > bottom - edge ? Math.ceil((d.y - bottom + edge)/4) : 0;
  if(v){ const before = scrollY; window.scrollBy(0, v); if(scrollY !== before){ d.y0 -= scrollY - before; dragMove(); } }
}
function dragEnd(commit){
  const d = DRAG; if(!d) return; DRAG = null;
  clearTimeout(d.hold); clearInterval(d.timer);
  document.body.classList.remove('dragging-task');
  if(!d.on) return;
  d.row.classList.remove('dragging'); d.row.style.transform = '';
  const ids = d.row.isConnected ? dragGroup(d.row).map(r => r.dataset.tid) : [];
  if(commit && ids.length && applyTaskOrder(ids)) save(); else render();
}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.task .drag'); if(!h || DRAG || (e.pointerType==='mouse' && e.button!==0)) return;
  const row = h.closest('.task'); if(dragGroup(row).length < 2) return;
  const touch = e.pointerType !== 'mouse';
  DRAG = {h, row, pid:e.pointerId, touch, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, on:false};
  if(!touch) e.preventDefault(); /* без выделения текста */
  if(touch) DRAG.hold = setTimeout(() => { if(DRAG && !DRAG.on){ if(DRAG.row.isConnected) dragStart(); else DRAG = null; } }, 180);
});
document.addEventListener('pointermove', e => {
  const d = DRAG; if(!d || e.pointerId!==d.pid) return;
  d.x = e.clientX; d.y = e.clientY;
  if(!d.on){
    const dist = Math.hypot(d.x - d.sx, d.y - d.sy);
    if(d.touch){ if(dist > 10) dragEnd(false); return; } /* палец сдвинулся раньше, чем удержание — это не перетаскивание */
    if(dist < 4) return;
    dragStart();
  }
  e.preventDefault(); dragMove();
}, {passive:false});
document.addEventListener('pointerup', e => { if(DRAG && e.pointerId===DRAG.pid) dragEnd(true); });
document.addEventListener('pointercancel', e => { if(DRAG && e.pointerId===DRAG.pid) dragEnd(true); });
/* старый Safari: пока задача перетаскивается, страница не прокручивается пальцем */
document.addEventListener('touchmove', e => { if(DRAG && DRAG.on) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('.task .drag')) e.preventDefault(); });
/* клавиатура: фокус на ⋮⋮ и стрелки вверх/вниз */
document.addEventListener('keydown', e => {
  if(!(e.key==='ArrowUp' || e.key==='ArrowDown') || !e.target.closest || !e.target.closest('.task .drag')) return;
  const row = e.target.closest('.task'), grp = dragGroup(row), i = grp.indexOf(row), j = i + (e.key==='ArrowUp' ? -1 : 1);
  e.preventDefault(); if(j < 0 || j >= grp.length) return;
  const ids = grp.map(r => r.dataset.tid); [ids[i], ids[j]] = [ids[j], ids[i]];
  if(applyTaskOrder(ids)){ save(); const h = document.querySelector(`.task[data-tid="${CSS.escape(row.dataset.tid)}"] .drag`); if(h) h.focus(); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = ACT[el.dataset.a], inMenu = !!el.closest('#menuPop');
  if(fn) fn(el.dataset, el, e);

  const fn = CH[el.dataset.c]; if(fn) fn(el.value, el.dataset, el);

function tripDays(t){
  if(t.start && t.end && t.end>=t.start){ const out = []; for(let k=t.start; k<=t.end && out.length<366; k=addDays(k,1)) out.push(k); return out; }

  if(t.end) return 'до '+fmtD(t.end, y);

}

const DOC_CATS = [['flights','✈️','Авиабилеты'],['stay','🏨','Жильё'],['transport','🚆','Транспорт'],['visa','🛂','Визы'],['insurance','🛡','Страховка'],['tours','🎟','Экскурсии'],['other','📎','Другое']];
const DOC_TYPES = {'application/pdf':'pdf', 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp'};
const DOC_EXT = {pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp'};
const DOC_MAX = 20*1024*1024; // столько же разрешено в настройке bucket travel-documents
/* параметры встроенного PDF-просмотрщика (часть адреса после #, на сервер не отправляется):
   navpanes=0 — Chrome, Edge и Adobe: панель миниатюр скрыта (открывается кнопкой ☰);
   view=FitH — Chrome, Edge и Adobe: масштаб по ширине;
   pagemode=none и zoom=page-width — то же для Firefox. Safari эти параметры не читает. */
const PDF_VIEW = '#view=FitH&navpanes=0&pagemode=none&zoom=page-width';
const docViewUrl = (x, u) => x.mime==='application/pdf' ? u.view+PDF_VIEW : u.view;
const docCatOf = k => DOC_CATS.find(c => c[0]===k) || DOC_CATS[DOC_CATS.length-1];
const tripDocs = t => S.docs.filter(x => x.tripId===t.id);
const isImgDoc = x => x.type==='file' && /^image\//.test(x.mime||'');
const fmtSize = b => b>=1048576 ? r1(b/1048576).toString().replace('.',',')+' МБ' : Math.max(1, Math.round((+b||0)/1024))+' КБ';
const docMime = f => DOC_TYPES[f.type] ? f.type : (DOC_EXT[(String(f.name).split('.').pop()||'').toLowerCase()] || '');
const linkHost = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(err) { return 'ссылка'; } };
function docFileName(x){
  const ext = DOC_TYPES[x.mime] || 'bin';
  let n = String(x.title || 'document').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').trim().slice(0,90) || 'document';
  return n.toLowerCase().endsWith('.'+ext) ? n : n+'.'+ext;
}
function docMeta(x){
  const c = docCatOf(x.cat);
  return [c[1]+' '+c[2], c[0]==='stay' ? stayMeta(x) : x.date ? fmtD(x.date,{day:'numeric', month:'long', year:'numeric'}) : '',
    x.type==='link' ? '🔗 '+linkHost(x.url) : (DOC_TYPES[x.mime]||'файл').toUpperCase()+' · '+fmtSize(x.size)].filter(Boolean).join(' · ');

function docRow(x){

  </div>`;

/* временные ссылки на файлы (на 1 час) — только для открытой поездки */
async function resolveDocUrls(force){
  const t = UI.trip && byId(S.trips, UI.trip);
  if(!t || !CL.sb || !CL.uid || CL.dbusy) return;
  const now = Date.now();
  const need = tripDocs(t).filter(x => x.type==='file' && x.path && !(CL.durls[x.id] && CL.durls[x.id].exp>now+600e3) && (force || !(CL.dmiss[x.id]>now)));
  if(!need.length) return;
  CL.dbusy = true; let ch = false;
  try {
    const {data, error} = await CL.sb.storage.from(SB_DOCS).createSignedUrls(need.map(x => x.path), 3600);
    if(error) throw error;
    (data||[]).forEach((r,i) => { const x = need.find(d => d.path===r.path) || need[i]; if(!x) return;
      if(r.signedUrl && !r.error){ CL.durls[x.id] = {view:r.signedUrl, dl:r.signedUrl+(r.signedUrl.includes('?') ? '&' : '?')+'download='+encodeURIComponent(docFileName(x)), exp:now+3600e3}; ch = true; }
      else CL.dmiss[x.id] = now+60e3; });
    if(force && need.some(x => !CL.durls[x.id])) toast('Файл не найден в облаке — возможно, он ещё загружается с другого устройства');
  } catch(err) { need.forEach(x => { CL.dmiss[x.id] = now+30e3; }); if(force) toast(docErrText(err)); }
  finally { CL.dbusy = false; }
  if(ch) requestRender();
}
function openDocViewer(id){
  const x = byId(S.docs, id); if(!x) return;

/* загрузка с прогрессом: напрямую в Storage API, с токеном текущего входа */
async function uploadWithProgress(bucket, path, blob, mime, onp){
  const r = await CL.sb.auth.getSession(), tok = r && r.data && r.data.session && r.data.session.access_token;
  if(!tok) throw {userMsg:'Вход истёк — выйди и войди снова'};
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', `${SB_URL}/storage/v1/object/${bucket}/${path.split('/').map(encodeURIComponent).join('/')}`);
    x.setRequestHeader('authorization', 'Bearer '+tok);
    x.setRequestHeader('apikey', SB_KEY);
    x.setRequestHeader('content-type', mime);
    x.setRequestHeader('x-upsert', 'false');
    x.setRequestHeader('cache-control', 'max-age=3600');
    x.timeout = 15*60*1000;
    x.upload.onprogress = e => { if(e.lengthComputable) onp(e.loaded/e.total); };
    x.onload = () => {
      if(x.status>=200 && x.status<300){ onp(1); return res(); }
      let m = {}; try { m = JSON.parse(x.responseText) || {}; } catch(err) {}
      rej({status: +(m.statusCode || x.status), message: m.message || m.error || x.statusText});
    };
    x.onerror = () => rej({net:true});
    x.ontimeout = () => rej({net:true});
    x.send(blob);
  });
}

/* ---------- рейсы: сегменты авиабилета, длительность, пересадки ----------
   Рейсы хранятся внутри документа категории «Авиабилеты» (поле flights) и синхронизируются вместе с ним.
   Время вводится местное; часовой пояс аэропорта — IANA (Asia/Tokyo) или смещение (UTC+3).
   Без часовых поясов длительность не считается — ничего не угадываем. */
const isFlightDoc = x => docCatOf(x.cat)[0]==='flights';
const TZ_CACHE = {};
function tzParse(tz){

  if(/^(utc|gmt|z)$/i.test(tz)) return {fixed:0};
  const m = /^(?:utc|gmt)?\s*([+\-−])\s*(\d{1,2})(?:[:.]?(\d{2}))?$/i.exec(tz);
  if(m){ const v = (m[1]==='+' ? 1 : -1)*(+m[2]*60 + +(m[3]||0)); return Math.abs(v)<=14*60 ? {fixed:v} : null; }
  try { TZ_CACHE[tz] = TZ_CACHE[tz] || new Intl.DateTimeFormat('en-US', {timeZone:tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}); return {iana:tz}; }
  catch(err) { return null; }
}
function tzOffset(z, ms){

  return Math.round((Date.UTC(+p.year, +p.month-1, +p.day, +p.hour%24, +p.minute, +p.second) - Math.floor(ms/1000)*1000)/60000);
}
const naive = (date, time) => { if(!/^\d{4}-\d\d-\d\d$/.test(date||'') || !/^\d\d:\d\d/.test(time||'')) return null; const [y,mo,d] = date.split('-').map(Number), [h,mi] = time.split(':').map(Number); return Date.UTC(y, mo-1, d, h, mi); };

function toUtc(date, time, tz){

/* рейсы по порядку: по моменту вылета, без пояса — по местным дате и времени */
function segsSorted(x){

    .sort((a,b) => { const ka = a.c.dep ?? naive(a.s.depDate, a.s.depTime||'00:00'), kb = b.c.dep ?? naive(b.s.depDate, b.s.depTime||'00:00');

  else if(ms!=null && ms<60*60000) warn.push(`Короткая пересадка. Минимальное время стыковки у каждого аэропорта своё — проверь его для ${prev.s.to || 'аэропорта пересадки'} у авиакомпании или в аэропорту`);

/* пункты «Что перенести»: по строкам и через «;», без маркеров списка */
function moveItems(text){

}
const normText = v => String(v||'').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!…]+$/, '');

function carryList(text, carried, target){
  const existing = S.tasks.filter(x => x.date===target).map(x => normText(x.text)), seen = [];
  return moveItems(text).map(t => { const n = normText(t);
    const why = (carried||[]).some(c => normText(c.text)===n) ? 'уже перенесено' : existing.includes(n) ? 'такая задача уже есть' : seen.includes(n) ? 'повтор' : '';

/* создаёт задачи на дату target без дублей и запоминает перенесённое в отчёте */
function carryInto(r, picked, target, slot){

  picked.forEach(it => { const nt = normText(it.text);
    if(S.tasks.some(x => x.date===target && normText(x.text)===nt) || r.carried.some(c => normText(c.text)===nt)) return;
    const task = {id:uid(), date:target, slot, text:it.text, done:false};
    S.tasks.push(task); r.carried.push({text:it.text, taskId:task.id, date:target, at:Date.now()}); n++; });

}

/* =========================================================
   САМОРАЗВИТИЕ · видео, материалы, домашние задания

const SB_LEARN = 'learning-files';
const LF_MAX = 20*1024*1024;  // как в настройке bucket learning-files
const LF_TYPES = {pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', doc:'application/msword',
  odt:'application/vnd.oasis.opendocument.text', rtf:'application/rtf', txt:'text/plain', md:'text/markdown'};
const lfExt = n => (String(n||'').split('.').pop()||'').toLowerCase();
const lfMime = f => LF_TYPES[lfExt(f.name)] || (Object.values(LF_TYPES).includes(f.type) ? f.type : '');
const lfExtOf = m => Object.keys(LF_TYPES).find(k => LF_TYPES[k]===m && k!=='jpeg') || 'bin';
const lfIcon = m => m==='application/pdf' ? 'PDF' : /^image\//.test(m) ? '🖼' : /^text\//.test(m) ? 'TXT' : 'DOC';
const learnMod = (cid, mid) => { const c = byId(S.courses, cid), m = c && byId(c.modules||[], mid); return m ? {c, m} : null; };

function secMap(){ try { return JSON.parse(localStorage.getItem('da_learn_sec') || '{}') || {}; } catch(err) { return {}; } }

function secSet(k, v){ const m = secMap(); m[k] = v; try { localStorage.setItem('da_learn_sec', JSON.stringify(m)); } catch(err) {} }

function learnRemember(cid, mid, vid){ const l = learnLast() || {}; const v = {cid, mid, vid: vid || (l.cid===cid && l.mid===mid ? l.vid : '')}; try { localStorage.setItem('da_learn_last', JSON.stringify(v)); } catch(err) {} }
