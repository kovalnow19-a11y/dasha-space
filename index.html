    const ni = document.querySelector(`[data-newtask="${d.slot}"]`); if(ni) ni.focus(); },
  pullOverdue: () => { S.tasks.forEach(t => { if(!t.done && t.date<T()) t.date = T(); }); save(); toast('Задачи перенесены на сегодня'); },
  moveUndone: () => { let n = 0; S.tasks.forEach(t => { if(t.date===T() && !t.done){ t.date = addDays(T(),1); n++; } }); save(); toast(`Перенесено на завтра: ${n}`); },
  tDur: d => { if(S.timer) return; S.timerCfg.dur = +d.v; save(); },
  tStart: () => { if(!S.timer) S.timer = {section:S.timerCfg.section, dur:S.timerCfg.dur, acc:0, start:Date.now(), running:true};
    else if(!S.timer.running){ S.timer.running = true; S.timer.start = Date.now(); } save(); },
  tPause: () => { const t = S.timer; if(t && t.running){ t.acc += Date.now()-t.start; t.running = false; save(); } },
  tStop: () => finishTimer(false),
  habitToggle: d => { const k = T(), arr = S.habitLog[k] || (S.habitLog[k] = []), i = arr.indexOf(d.id);
    if(i>-1){ arr.splice(i,1); if(!arr.length) delete S.habitLog[k]; } else arr.push(d.id); save(); },
  habitAdd: () => openHabitForm(null),
  habitEdit: d => { const h = byId(S.habits,d.id); if(h) openHabitForm(h); },
  habitOpen: d => { UI.hsel = d.id; UI.hmonth = T().slice(0,7); renderHabitModal(); },
  habitCal: () => { UI.hmonth = T().slice(0,7); renderHabitModal(); },
  hSel: d => { UI.hsel = d.id; renderHabitModal(); },
  hMonth: d => { const [y,m] = (UI.hmonth || T().slice(0,7)).split('-').map(Number), nd = new Date(y, m-1+(+d.v), 1);
    UI.hmonth = nd.getFullYear()+'-'+pad(nd.getMonth()+1); renderHabitModal(); },
  hDay: d => { const h = byId(S.habits,UI.hsel); if(!h || d.d>T()) return;
    const arr = S.habitLog[d.d] || (S.habitLog[d.d] = []), i = arr.indexOf(h.id);
    if(i>-1){ arr.splice(i,1); if(!arr.length) delete S.habitLog[d.d]; } else { arr.push(h.id); if(d.d<h.created) h.created = d.d; }
    persist(); render(); renderHabitModal(); },
  habitDel: d => { const h = byId(S.habits,d.id); if(!h || !confirm(`Удалить привычку «${h.name}» и всю её историю?`)) return;
    del(S.habits,h.id);
    Object.keys(S.habitLog).forEach(k => { S.habitLog[k] = S.habitLog[k].filter(x => x!==h.id); if(!S.habitLog[k].length) delete S.habitLog[k]; });
    UI.hsel = null; closeModal(); save(); toast('Привычка удалена'); },

  /* блог */
  bTab: d => { UI.btab = d.v; render(); },
  bPlat: d => { UI.bplat = d.v; render(); },
  bWeek: d => { UI.bweek = +d.v===0 ? weekStart(T()) : addDays(UI.bweek, 7*d.v); render(); },
  bMonth: d => { if(+d.v===0) UI.bmonth = T().slice(0,7); else { const [y,m] = UI.bmonth.split('-').map(Number); const nd = new Date(y, m-1+(+d.v), 1); UI.bmonth = nd.getFullYear()+'-'+pad(nd.getMonth()+1); } render(); },
  ideaNew: d => openIdea(null, {date:d.date||'', platform:d.plat||'Instagram', status:d.status||'идея'}),
  ideaOpen: d => openIdea(d.id),
  ideaNext: d => { const i = byId(S.ideas,d.id); if(!i) return; const si = STATUSES.indexOf(i.status);
    if(si<STATUSES.length-1){ i.status = STATUSES[si+1]; const n = i.status==='опубликовано' ? ensurePosts(i) : 0; save();
      toast(n ? 'Опубликовано — ролик добавлен в «Результаты»' : 'Статус: '+i.status); } },
  rPlat: d => { UI.rplat = d.v; render(); },
  cmpToggle: d => { const i = UI.cmp.indexOf(d.id); if(i>-1) UI.cmp.splice(i,1); else UI.cmp.push(d.id); render(); },
  cmpOpen: () => openCompare(),
  cmpClear: () => { UI.cmp = []; closeModal(); render(); },
  postNew: () => openPostForm(null),
  postOpen: d => { UI.post = d.id; renderPostModal(); },
  postEdit: () => { const p = byId(S.posts,UI.post); if(p) openPostForm(p); },
  postDel: () => { const p = byId(S.posts,UI.post); if(!p || !confirm(`Удалить ролик «${p.title}» со всей статистикой и изображениями?`)) return;
    dropMedia([p.cover, ...p.shots]); del(S.posts,p.id); UI.cmp = UI.cmp.filter(x => x!==p.id); UI.post = null; closeModal(); save(); toast('Ролик удалён'); },
  snapNew: () => openSnapForm(null),
  snapEdit: d => openSnapForm(d.id),
  upCover: () => pickImages('cover'),
  coverDel: () => { const p = byId(S.posts,UI.post); if(!p || !p.cover) return; dropMedia([p.cover]); p.cover = null; persist(); render(); renderPostModal(); },
  upShots: () => pickImages('shots'),
  shotReplace: d => pickImages('replace', {i:+d.i}),
  shotDel: d => { const p = byId(S.posts,UI.post); if(!p || !confirm('Удалить скриншот?')) return; const id = p.shots.splice(+d.i,1)[0]; dropMedia([id]); persist(); render(); renderPostModal(); },
  shotView: d => { LB = {post:UI.post, i:+d.i}; showLB(); },
  lbPrev: () => { const p = byId(S.posts,LB.post); LB.i = (LB.i-1+p.shots.length)%p.shots.length; showLB(); },
  lbNext: () => { const p = byId(S.posts,LB.post); LB.i = (LB.i+1)%p.shots.length; showLB(); },
  lbClose: () => { LB = null; showLB(); },
  lbBg: (d, el, e) => { if(e.target===el){ LB = null; showLB(); } },
  refNew: () => openRef(null),
  refOpen: d => openRef(d.id),

  /* journaling */
  jTab: d => { UI.jtab = d.v; render(); },
  jNew: d => openEntry(null, d.type),
  jOpen: d => openEntry(d.id),
  jPrompt: () => { let p; do { p = rand([...PROMPTS.morning, ...PROMPTS.evening, ...PROMPTS.free]); } while(p===UI.jprompt); UI.jprompt = p; render(); },
  jAnswer: () => openEntry(null, 'free', UI.jprompt),
  jFilter: d => { UI.jf = d.v; render(); },
  jWeek: d => { UI.jweek = +d.v===0 ? weekStart(T()) : addDays(UI.jweek, 7*d.v); render(); },

  /* саморазвитие */
  courseNew: () => { const c = {id:uid(), title:'', modules:[]};
    openForm({title:'Новый курс', values:c, fields:[{k:'title', label:'Название курса', req:true}], onSave: v => { Object.assign(c,v); S.courses.push(c); }}); },
  courseEdit: d => { const c = byId(S.courses,d.id); if(!c) return;
    openForm({title:'Курс', values:c, fields:[{k:'title', label:'Название курса', req:true}], onSave: v => Object.assign(c,v), onDelete: () => del(S.courses,c.id)}); },
  modToggle: d => { const c = byId(S.courses,d.cid), m = c && byId(c.modules,d.mid); if(m){ m.done = !m.done; save(); if(m.done) toast('Модуль пройден 🎉'); } },
  modOpen: d => openModule(d.cid, d.mid),
  modAdd: d => { const inp = document.querySelector(`[data-newmod="${d.cid}"]`), v = inp.value.trim(), c = byId(S.courses,d.cid); if(!v || !c) return;
    c.modules.push({id:uid(), title:v, done:false, notes:'', apply:''}); save(); },
  goalToggle: d => { const g = byId(S.goals,d.id); if(g){ g.done = !g.done; save(); } },
  goalDel: d => { del(S.goals,d.id); save(); },
  goalEdit: d => { const g = byId(S.goals,d.id); if(!g) return;
    openForm({title:'Цель', values:g, fields:[{k:'text', label:'Цель', req:true}, {k:'done', label:'Выполнено', type:'check'}], onSave: v => Object.assign(g,v), onDelete: () => del(S.goals,g.id)}); },
  goalAdd: d => { const inp = document.querySelector(`[data-newgoal="${d.p}"]`), v = inp.value.trim(); if(!v) return;
    S.goals.push({id:uid(), text:v, period:d.p, key: d.p==='week' ? weekStart(T()) : T().slice(0,7), done:false}); save(); },
  bookNew: () => openBook(null),
  bookOpen: d => openBook(d.id),

  /* окно */
  mbg: (d, el, e) => { if(e.target===el) closeModal(); },
  mclose: () => closeModal(),
  msave: () => {
    const v = collect();
    const miss = FORM.fields.find(f => f.req && !String(v[f.k]||'').trim());
    if(miss){ toast('Заполни поле «'+miss.label+'»'); return; }
    const bad = FORM.validate && FORM.validate(v); if(bad){ toast(bad); return; }
    const after = FORM.after; FORM.onSave(v); closeModal(); save(); toast('Сохранено'); if(after) after();
  },
  mdel: () => { if(!confirm('Удалить безвозвратно?')) return; const after = FORM.after; FORM.onDelete(); closeModal(); save(); toast('Удалено'); if(after) after(); },
  scale: (d, el) => { const was = el.classList.contains('on'); el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); if(!was) el.classList.add('on'); },
  chip: (d, el) => el.classList.toggle('on'),
  swt: (d, el) => el.classList.toggle('on'),

  /* данные */
  export: () => {
    const blob = new Blob([JSON.stringify(Object.assign({}, S, {media:MEDIA}))], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `kabinet-${T()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Файл сохранён в загрузки');
  },
  import: () => document.getElementById('importFile').click(),
  wipe: () => { if(!confirm('Удалить ВСЕ данные? Это нельзя отменить. Сначала лучше сделать экспорт.')) return;
    const n = S.name; S = emptyState(); S.name = n; S.habitsSeeded = 1; S.blogSeeded = 1; S.postsMigrated = 1; MEDIA = {}; persistMedia(); UI.cmp = [];
    closeModal(); save(); toast('Кабинет очищен'); }
};

/* ---------- изменения в полях ---------- */
const CH = {
  mainTask: v => { day(T()).main = v; persist(); },
  rDone: v => { day(T()).rDone = v; persist(); },
  rMove: v => { day(T()).rMove = v; persist(); },
  tSection: v => { S.timerCfg.section = v; persist(); },
  jSearch: v => { UI.jq = v.trim(); render(); },
  wThoughts: (v,d) => { (S.weekly[d.w] = S.weekly[d.w] || {}).thoughts = v; persist(); },
  wConcl: (v,d) => { (S.weekly[d.w] = S.weekly[d.w] || {}).concl = v; persist(); },
  rPer: v => { UI.rper = v; render(); },
  rSort: v => { UI.rsort = v; render(); },
  setName: v => { S.name = v.trim() || 'Даша'; save(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = ACT[el.dataset.a]; if(fn) fn(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target; if(!el.dataset || !el.dataset.c) return;
  const fn = CH[el.dataset.c]; if(fn) fn(el.value, el.dataset, el);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && LB){ LB = null; showLB(); return; }
  if(e.key==='Escape' && document.getElementById('modalRoot').innerHTML) closeModal();
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.enter && !e.isComposing){
    e.preventDefault(); const fn = ACT[e.target.dataset.enter]; if(fn) fn(e.target.dataset, e.target, e);
  }
});
['input','change'].forEach(type => document.getElementById('modalRoot').addEventListener(type, e => {
  if(FORM && FORM.onInput && e.target.name) FORM.onInput(document.getElementById('mform'), e.target.name);
}));
document.getElementById('mediaFile').addEventListener('change', e => {
  const files = [...e.target.files].filter(f => /^image\//.test(f.type)); e.target.value = '';
  if(files.length) handleImages(files); else UPLOAD = null;
});
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if(!d || typeof d!=='object' || Array.isArray(d)) throw new Error('bad');
      if(!confirm('Заменить текущие данные данными из файла?')) return;
      const media = d.media && typeof d.media==='object' && !Array.isArray(d.media) ? d.media : null; delete d.media;
      const prevMedia = MEDIA;
      if(media){ MEDIA = media; if(!persistMedia()){ MEDIA = prevMedia; persistMedia(); alert('Изображения из файла не поместились в хранилище браузера — записи загружены без них.'); } }
      S = normalize(cleanDemo(d)); prepHabits(); prepBlog(); closeModal(); save(); toast('Данные загружены ✨');
    } catch(err) { alert('Не получилось прочитать файл. Нужен файл экспорта из кабинета (.json).'); }
    finally { e.target.value = ''; }
  };
  r.readAsText(file);
});

/* =========================================================
   НАВИГАЦИЯ И ОТРИСОВКА
   ========================================================= */
const VIEWS = {home:vHome, blog:vBlog, journal:vJournal, self:vSelf};
let view = (location.hash||'').slice(1);
if(!VIEWS[view]) view = 'home';

function go(v){
  if(!VIEWS[v]) v = 'home';
  view = v;
  if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(VIEWS[v] && v!==view) go(v); });

function render(){
  document.getElementById('app').innerHTML = VIEWS[view]();
  document.getElementById('nav').innerHTML = NAV.map(([k,l,s,i]) =>
    `<button class="${k===view?'on':''}" data-a="nav" data-v="${k}"><span class="ico">${i}</span><span class="nl">${l}</span><span class="ns">${s}</span></button>`).join('');
}

/* перерисовка главной раз в минуту (приветствие, смена дня) */
let lastDay = T();
setInterval(() => {
  if(T()!==lastDay) lastDay = T();
  const active = document.activeElement;
  if(!document.getElementById('modalRoot').innerHTML && !(active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) && view==='home') render();
}, 60000);

function prepHabits(){ S.habits.forEach(fixHabit); seedHabits(); }
prepHabits();
prepBlog();
persist();
render();
